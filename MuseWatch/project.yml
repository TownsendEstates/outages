name: MuseWatch
options:
  bundleIdPrefix: ca.townsendestates
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer Team ID here (or pick it in Xcode > Signing & Capabilities)
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  MuseWatch:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    dependencies:
      - target: MuseWatchWatch
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Muse Watch
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.townsendestates.musewatch
        INFOPLIST_KEY_CFBundleDisplayName: Muse Watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  MuseWatchWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    dependencies:
      - target: MuseWatchComplication
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Muse
        WKApplication: true
        WKCompanionAppBundleIdentifier: ca.townsendestates.musewatch
        WKRunsIndependentlyOfCompanionApp: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.townsendestates.musewatch.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: Muse
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  MuseWatchComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidget
    info:
      path: WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Muse
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.townsendestates.musewatch.watchkitapp.complication
