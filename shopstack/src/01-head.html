<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopStack</title>
<meta name="description" content="Cloud shop management for tire and auto service businesses: work orders, POS, inventory, distributor ordering, accounting, payroll, CRM and AI.">
<style>
:root{
  --brand:#0F766E; --brand-ink:#ffffff; --accent:#F59E0B;
  --bg:#F4F6F8; --panel:#FFFFFF; --panel2:#F9FAFB; --ink:#111827; --muted:#6B7280; --line:#E5E7EB;
  --good:#15803D; --warn:#B45309; --bad:#B91C1C; --info:#1D4ED8;
  --good-bg:#DCFCE7; --warn-bg:#FEF3C7; --bad-bg:#FEE2E2; --info-bg:#DBEAFE;
  --radius:10px; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  --font: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1220; --panel:#111A2B; --panel2:#0F1726; --ink:#E5E7EB; --muted:#9CA3AF; --line:#1F2A3D;
    --good-bg:#052E1A; --warn-bg:#3A2A06; --bad-bg:#3B0D0D; --info-bg:#0B2350;
    --good:#4ADE80; --warn:#FBBF24; --bad:#F87171; --info:#93C5FD;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1220; --panel:#111A2B; --panel2:#0F1726; --ink:#E5E7EB; --muted:#9CA3AF; --line:#1F2A3D;
  --good-bg:#052E1A; --warn-bg:#3A2A06; --bad-bg:#3B0D0D; --info-bg:#0B2350;
  --good:#4ADE80; --warn:#FBBF24; --bad:#F87171; --info:#93C5FD;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font)}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--brand) 50%,transparent);border-color:var(--brand)}
input[type=checkbox]{width:auto}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.accent{background:var(--accent);color:#111;border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.ai{background:linear-gradient(135deg,#7C3AED,#2563EB);color:#fff;border:0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.card h3{margin:0 0 10px;font-size:15px}
.muted{color:var(--muted)}
.small{font-size:12px}
.right{text-align:right}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.pill.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.kpi .v{font-size:22px;font-weight:700}
.kpi .l{font-size:12px;color:var(--muted)}
table.t{width:100%;border-collapse:collapse}
table.t th,table.t td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
table.t tr.click:hover td{background:var(--panel2);cursor:pointer}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--brand);font-weight:600}
/* Shell */
#app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
#side{background:var(--panel);border-right:1px solid var(--line);padding:12px 8px;position:sticky;top:0;height:100vh;overflow-y:auto}
#side .brand{display:flex;gap:8px;align-items:center;padding:4px 8px 12px;font-weight:700}
#side .brand img{width:28px;height:28px;border-radius:6px;object-fit:cover}
#side .logo{width:28px;height:28px;border-radius:6px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800}
#side nav a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:13.5px}
#side nav a:hover{background:var(--panel2)}
#side nav a.on{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);font-weight:600}
#side nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 10px 4px}
#main{min-width:0;display:flex;flex-direction:column}
#top{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
#top h1{font-size:17px;margin:0}
#view{padding:16px;max-width:1400px;width:100%}
#menuBtn{display:none}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;left:0;top:0;z-index:30;width:260px;transform:translateX(-100%);transition:transform .2s}
  #side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  #menuBtn{display:inline-flex}
  #view{padding:12px 16px}
  .hide-m{display:none}
}
/* Modal / toast */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:24px 12px}
#modal.on{display:flex}
#modal .box{background:var(--panel);border-radius:12px;width:min(900px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35)}
#modal .box.narrow{width:min(520px,100%)}
#modal header{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
#modal header h2{font-size:16px;margin:0;flex:1}
#modal .body{padding:16px}
#modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
#toasts{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);max-width:360px}
.toast.bad{background:var(--bad);color:#fff}
/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
#login .card{width:min(380px,100%);text-align:center}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pinpad button{padding:14px;font-size:18px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.pindots{font-size:28px;letter-spacing:8px;height:36px}
/* Kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:120px}
.kcol h4{margin:2px 4px 8px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px;cursor:grab}
.kcol.drop{outline:2px dashed var(--brand)}
/* Inspection */
.insp{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.lights button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:12px}
.lights button.g.on{background:var(--good);color:#fff}
.lights button.y.on{background:#EAB308;color:#111}
.lights button.r.on{background:var(--bad);color:#fff}
/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto}
.cal .day{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:180px}
.cal .day.today{border-color:var(--brand)}
.appt{border-left:3px solid var(--brand);background:var(--panel2);padding:6px;border-radius:6px;margin-top:6px;font-size:12px;cursor:pointer}
/* AI */
.chat{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;padding:4px}
.msg{padding:10px 12px;border-radius:10px;max-width:85%;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--brand);color:var(--brand-ink)}
.msg.a{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px}
.bars div{flex:1;background:var(--brand);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.bars div:hover{opacity:1}
.empty{padding:30px;text-align:center;color:var(--muted)}
.flag{border-left:4px solid var(--warn);background:var(--warn-bg);padding:10px 12px;border-radius:8px;margin:8px 0}
.flag.bad{border-color:var(--bad);background:var(--bad-bg)}
.flag.info{border-color:var(--info);background:var(--info-bg)}
@media print{#side,#top,.noprint{display:none!important}#app{display:block}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toasts"></div>
<script>
