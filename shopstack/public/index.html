<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopStack</title>
<meta name="description" content="Cloud shop management for tire and auto service businesses: work orders, POS, inventory, distributor ordering, accounting, payroll, CRM and AI.">
<style>
:root{
  --brand:#0F766E; --brand-ink:#ffffff; --accent:#F59E0B;
  --bg:#F4F6F8; --panel:#FFFFFF; --panel2:#F9FAFB; --ink:#111827; --muted:#6B7280; --line:#E5E7EB;
  --good:#15803D; --warn:#B45309; --bad:#B91C1C; --info:#1D4ED8;
  --good-bg:#DCFCE7; --warn-bg:#FEF3C7; --bad-bg:#FEE2E2; --info-bg:#DBEAFE;
  --radius:10px; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  --font: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1220; --panel:#111A2B; --panel2:#0F1726; --ink:#E5E7EB; --muted:#9CA3AF; --line:#1F2A3D;
    --good-bg:#052E1A; --warn-bg:#3A2A06; --bad-bg:#3B0D0D; --info-bg:#0B2350;
    --good:#4ADE80; --warn:#FBBF24; --bad:#F87171; --info:#93C5FD;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1220; --panel:#111A2B; --panel2:#0F1726; --ink:#E5E7EB; --muted:#9CA3AF; --line:#1F2A3D;
  --good-bg:#052E1A; --warn-bg:#3A2A06; --bad-bg:#3B0D0D; --info-bg:#0B2350;
  --good:#4ADE80; --warn:#FBBF24; --bad:#F87171; --info:#93C5FD;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font)}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--brand) 50%,transparent);border-color:var(--brand)}
input[type=checkbox]{width:auto}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.accent{background:var(--accent);color:#111;border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.ai{background:linear-gradient(135deg,#7C3AED,#2563EB);color:#fff;border:0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.card h3{margin:0 0 10px;font-size:15px}
.muted{color:var(--muted)}
.small{font-size:12px}
.right{text-align:right}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.pill.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.kpi .v{font-size:22px;font-weight:700}
.kpi .l{font-size:12px;color:var(--muted)}
table.t{width:100%;border-collapse:collapse}
table.t th,table.t td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
table.t tr.click:hover td{background:var(--panel2);cursor:pointer}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--brand);font-weight:600}
/* Shell */
#app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
#side{background:var(--panel);border-right:1px solid var(--line);padding:12px 8px;position:sticky;top:0;height:100vh;overflow-y:auto}
#side .brand{display:flex;gap:8px;align-items:center;padding:4px 8px 12px;font-weight:700}
#side .brand img{width:28px;height:28px;border-radius:6px;object-fit:cover}
#side .logo{width:28px;height:28px;border-radius:6px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800}
#side nav a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:13.5px}
#side nav a:hover{background:var(--panel2)}
#side nav a.on{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);font-weight:600}
#side nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 10px 4px}
#main{min-width:0;display:flex;flex-direction:column}
#top{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
#top h1{font-size:17px;margin:0}
#view{padding:16px;max-width:1400px;width:100%}
#menuBtn{display:none}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;left:0;top:0;z-index:30;width:260px;transform:translateX(-100%);transition:transform .2s}
  #side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  #menuBtn{display:inline-flex}
  #view{padding:12px 16px}
  .hide-m{display:none}
}
/* Modal / toast */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:24px 12px}
#modal.on{display:flex}
#modal .box{background:var(--panel);border-radius:12px;width:min(900px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35)}
#modal .box.narrow{width:min(520px,100%)}
#modal header{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
#modal header h2{font-size:16px;margin:0;flex:1}
#modal .body{padding:16px}
#modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
#toasts{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);max-width:360px}
.toast.bad{background:var(--bad);color:#fff}
/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
#login .card{width:min(380px,100%);text-align:center}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pinpad button{padding:14px;font-size:18px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.pindots{font-size:28px;letter-spacing:8px;height:36px}
/* Kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:120px}
.kcol h4{margin:2px 4px 8px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px;cursor:grab}
.kcol.drop{outline:2px dashed var(--brand)}
/* Inspection */
.insp{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.lights button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:12px}
.lights button.g.on{background:var(--good);color:#fff}
.lights button.y.on{background:#EAB308;color:#111}
.lights button.r.on{background:var(--bad);color:#fff}
/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto}
.cal .day{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:180px}
.cal .day.today{border-color:var(--brand)}
.appt{border-left:3px solid var(--brand);background:var(--panel2);padding:6px;border-radius:6px;margin-top:6px;font-size:12px;cursor:pointer}
/* AI */
.chat{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;padding:4px}
.msg{padding:10px 12px;border-radius:10px;max-width:85%;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--brand);color:var(--brand-ink)}
.msg.a{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px}
.bars div{flex:1;background:var(--brand);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.bars div:hover{opacity:1}
.empty{padding:30px;text-align:center;color:var(--muted)}
.flag{border-left:4px solid var(--warn);background:var(--warn-bg);padding:10px 12px;border-radius:8px;margin:8px 0}
.flag.bad{border-color:var(--bad);background:var(--bad-bg)}
.flag.info{border-color:var(--info);background:var(--info-bg)}
@media print{#side,#top,.noprint{display:none!important}#app{display:block}}
</style>
</head>

/* ENGINE-START: pure business logic (no DOM); unit-tested in tests/engine.test.mjs */
const Engine = (() => {
  const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;

  // ---------------- Sales tax by province (2026) ----------------
  // gst = federal GST or the full HST; pst = provincial portion where separate.
  const TAX = {
    AB: { gst: 0.05, pst: 0, label: 'GST 5%' },
    BC: { gst: 0.05, pst: 0.07, label: 'GST 5% + PST 7%' },
    SK: { gst: 0.05, pst: 0.06, label: 'GST 5% + PST 6%' },
    MB: { gst: 0.05, pst: 0.07, label: 'GST 5% + RST 7%' },
    ON: { gst: 0.13, pst: 0, hst: true, label: 'HST 13%' },
    QC: { gst: 0.05, pst: 0.09975, label: 'GST 5% + QST 9.975%' },
    NS: { gst: 0.14, pst: 0, hst: true, label: 'HST 14%' },
    NB: { gst: 0.15, pst: 0, hst: true, label: 'HST 15%' },
    NL: { gst: 0.15, pst: 0, hst: true, label: 'HST 15%' },
    PE: { gst: 0.15, pst: 0, hst: true, label: 'HST 15%' },
    YT: { gst: 0.05, pst: 0, label: 'GST 5%' },
    NT: { gst: 0.05, pst: 0, label: 'GST 5%' },
    NU: { gst: 0.05, pst: 0, label: 'GST 5%' },
  };
  const taxFor = (prov, override) => (override && override.enabled ? { gst: +override.gst || 0, pst: +override.pst || 0, label: override.label || 'Custom tax' } : TAX[prov] || TAX.AB);

  // ---------------- Line pricing & document totals ----------------
  // line: {type:'labour'|'part'|'tire'|'fee'|'discount', qty, hours, rate, price, cost, taxable, envFee}
  function lineAmount(l) {
    if (l.type === 'labour') return r2((+l.hours || 0) * (+l.rate || 0));
    if (l.type === 'discount') return -Math.abs(r2((+l.qty || 1) * (+l.price || 0)));
    return r2((+l.qty || 0) * (+l.price || 0));
  }
  function totals(lines = [], s = {}) {
    const tax = taxFor(s.province, s.taxOverride);
    let labour = 0, parts = 0, tires = 0, fees = 0, discount = 0, cost = 0, taxable = 0, envFees = 0, tireCount = 0;
    for (const l of lines) {
      const a = lineAmount(l);
      if (l.type === 'labour') labour += a;
      else if (l.type === 'tire') { tires += a; tireCount += +l.qty || 0; }
      else if (l.type === 'part') parts += a;
      else if (l.type === 'fee') fees += a;
      else if (l.type === 'discount') discount += a;
      if (l.type === 'part' || l.type === 'tire') cost += r2((+l.qty || 0) * (+l.cost || 0));
      if (l.taxable !== false) taxable += a;
      if (l.type === 'tire' && l.envFee !== false && (s.envFeeTire || 0) > 0) envFees += r2((+l.qty || 0) * s.envFeeTire);
    }
    let supplies = 0;
    if ((s.shopSuppliesPct || 0) > 0 && labour > 0) {
      supplies = r2(labour * s.shopSuppliesPct / 100);
      if (s.shopSuppliesCap > 0) supplies = Math.min(supplies, s.shopSuppliesCap);
    }
    // Environmental levies are taxable in AB (GST applies to the levy); supplies are taxable.
    taxable += supplies + envFees;
    const gst = r2(taxable * tax.gst), pst = r2(taxable * tax.pst);
    const subtotal = r2(labour + parts + tires + fees + discount + supplies + envFees);
    const total = r2(subtotal + gst + pst);
    return { labour: r2(labour), parts: r2(parts), tires: r2(tires), fees: r2(fees), discount: r2(discount), supplies, envFees: r2(envFees), tireCount,
      subtotal, gst, pst, total, cost: r2(cost), margin: r2(subtotal - cost - envFees), taxLabel: tax.label, hst: !!tax.hst };
  }

  // Customer pricing tiers: retail uses list price; fleet / wholesale are cost-plus.
  function tierPrice(item, tier, s = {}) {
    const m = (s.markups || {})[tier];
    if (!tier || tier === 'retail' || m == null || !(+item.cost > 0)) return +item.price || 0;
    return r2(+item.cost * (1 + m / 100));
  }

  // ---------------- AMVIC estimate tolerance (Alberta) ----------------
  // Final bill may not exceed the authorized estimate by more than the tolerance
  // without recorded customer re-authorization.
  function estimateCheck(approvedTotal, finalTotal, s = {}) {
    if (!(approvedTotal > 0)) return { ok: false, reason: 'No authorized estimate on file' };
    const pct = s.estimateTolerancePct ?? 10, cap = s.estimateToleranceCap ?? 100;
    const allowed = r2(Math.min(approvedTotal * pct / 100, cap));
    const over = r2(finalTotal - approvedTotal);
    return { ok: over <= allowed, over, allowed, limit: r2(approvedTotal + allowed) };
  }

  // ---------------- Tire size parsing ----------------
  // 225/65R17 102H, P225/65R17, LT275/70R18 125/122S, 225/65-17
  function parseTire(str = '') {
    const m = String(str).toUpperCase().replace(/\s+/g, ' ').match(/(P|LT|ST)?\s?(\d{3})\s?\/\s?(\d{2})\s?(Z?R|-|D|B)?\s?(\d{2}(?:\.\d)?)(?:\s+(\d{2,3}(?:\/\d{2,3})?)\s?([A-Z]))?/);
    if (!m) return null;
    return { prefix: m[1] || '', width: +m[2], aspect: +m[3], rim: +m[5], load: m[6] || '', speed: m[7] || '',
      size: `${m[2]}/${m[3]}R${m[5]}`, diameterIn: r2((2 * m[2] * m[3] / 100) / 25.4 + +m[5]) };
  }

  // ---------------- Double-entry posting ----------------
  const ACC = { bank: '1000', card: '1020', ar: '1100', invTire: '1200', invPart: '1210', ap: '2000', gst: '2200', itc: '2205', pst: '2210', env: '2220', payroll: '2300',
    labour: '4000', parts: '4100', tires: '4200', fees: '4300', storage: '4400', discount: '4900', cogsTire: '5000', cogsPart: '5010', wages: '6000', erTax: '6010' };

  function je(date, memo, source, lines) {
    const ls = lines.filter((l) => r2(l.debit) || r2(l.credit)).map((l) => ({ account: l.account, debit: r2(l.debit), credit: r2(l.credit) }));
    const d = r2(ls.reduce((a, l) => a + l.debit, 0)), c = r2(ls.reduce((a, l) => a + l.credit, 0));
    if (Math.abs(d - c) > 0.005) throw new Error(`Unbalanced entry "${memo}": Dr ${d} / Cr ${c}`);
    return { date, memo, source, lines: ls };
  }

  function postInvoice(inv) {
    const t = inv.totals, tireCost = r2((inv.lines || []).filter((l) => l.type === 'tire').reduce((a, l) => a + (+l.qty || 0) * (+l.cost || 0), 0));
    const partCost = r2(t.cost - tireCost);
    return je(inv.date, `Invoice ${inv.number}`, `invoice:${inv.id}`, [
      { account: ACC.ar, debit: t.total },
      { account: ACC.labour, credit: t.labour },
      { account: ACC.parts, credit: t.parts },
      { account: ACC.tires, credit: t.tires },
      { account: ACC.fees, credit: r2(t.fees + t.supplies) },
      { account: ACC.discount, debit: -t.discount },
      { account: ACC.env, credit: t.envFees },
      { account: ACC.gst, credit: t.gst },
      { account: ACC.pst, credit: t.pst },
      { account: ACC.cogsTire, debit: tireCost }, { account: ACC.invTire, credit: tireCost },
      { account: ACC.cogsPart, debit: partCost }, { account: ACC.invPart, credit: partCost },
    ]);
  }
  function postPayment(p, invNumber) {
    const acct = p.method === 'credit' ? ACC.card : ACC.bank;
    return je(p.date, `Payment ${invNumber || ''} (${p.method})`, `payment:${p.id}`, [{ account: acct, debit: p.amount }, { account: ACC.ar, credit: p.amount }]);
  }
  function postBill(b) {
    const lines = (b.lines || []).map((l) => ({ account: l.account || ACC.invPart, debit: r2((+l.qty || 1) * (+l.cost || 0)) }));
    return je(b.date, `Bill ${b.number || ''} ${b.vendorName || ''}`.trim(), `bill:${b.id}`, [...lines, { account: ACC.itc, debit: b.gst || 0 }, { account: ACC.ap, credit: b.total }]);
  }
  function postBillPayment(b, amount, date) {
    return je(date, `Pay bill ${b.number || ''}`, `billpay:${b.id}`, [{ account: ACC.ap, debit: amount }, { account: ACC.bank, credit: amount }]);
  }

  // ---------------- Reports ----------------
  function balances(journal, accounts, from, to) {
    const map = {};
    for (const a of accounts) map[a.code] = { ...a, debit: 0, credit: 0 };
    for (const e of journal) {
      if ((from && e.date < from) || (to && e.date > to)) continue;
      for (const l of e.lines) {
        if (!map[l.account]) map[l.account] = { code: l.account, name: '(unknown ' + l.account + ')', type: 'expense', debit: 0, credit: 0 };
        map[l.account].debit += +l.debit || 0;
        map[l.account].credit += +l.credit || 0;
      }
    }
    return Object.values(map).map((a) => {
      const debitNormal = ['asset', 'cogs', 'expense'].includes(a.type);
      return { ...a, debit: r2(a.debit), credit: r2(a.credit), balance: r2(debitNormal ? a.debit - a.credit : a.credit - a.debit) };
    }).sort((a, b) => a.code.localeCompare(b.code));
  }
  function pnl(journal, accounts, from, to) {
    const b = balances(journal, accounts, from, to);
    const sum = (type) => r2(b.filter((a) => a.type === type).reduce((s, a) => s + a.balance, 0));
    const revenue = sum('revenue'), cogs = sum('cogs'), expense = sum('expense');
    return { rows: b.filter((a) => ['revenue', 'cogs', 'expense'].includes(a.type) && (a.debit || a.credit)), revenue, cogs, gross: r2(revenue - cogs), expense, net: r2(revenue - cogs - expense) };
  }
  function balanceSheet(journal, accounts, asOf) {
    const b = balances(journal, accounts, null, asOf);
    const sum = (type) => r2(b.filter((a) => a.type === type).reduce((s, a) => s + a.balance, 0));
    const earnings = r2(sum('revenue') - sum('cogs') - sum('expense'));
    const assets = sum('asset'), liabilities = sum('liability'), equity = r2(sum('equity') + earnings);
    return { rows: b.filter((a) => ['asset', 'liability', 'equity'].includes(a.type) && (a.debit || a.credit)), assets, liabilities, equity, earnings, balanced: Math.abs(assets - liabilities - equity) < 0.01 };
  }
  function gstReturn(journal, from, to) {
    let sales = 0, collected = 0, itc = 0;
    for (const e of journal) {
      if (e.date < from || e.date > to) continue;
      for (const l of e.lines) {
        if (l.account === ACC.gst) collected += (+l.credit || 0) - (+l.debit || 0);
        if (l.account === ACC.itc) itc += (+l.debit || 0) - (+l.credit || 0);
        if (/^4/.test(l.account)) sales += (+l.credit || 0) - (+l.debit || 0);
      }
    }
    return { line101: r2(sales), line103: r2(collected), line106: r2(itc), line109: r2(collected - itc) };
  }
  function aging(docs, asOf) {
    const b = { current: 0, d30: 0, d60: 0, d90: 0, total: 0 };
    const rows = [];
    for (const d of docs) {
      const bal = r2(d.balance);
      if (bal <= 0.004) continue;
      const days = Math.floor((new Date(asOf) - new Date(d.due || d.date)) / 86400000);
      const k = days <= 0 ? 'current' : days <= 30 ? 'd30' : days <= 60 ? 'd60' : 'd90';
      b[k] = r2(b[k] + bal); b.total = r2(b.total + bal);
      rows.push({ ...d, days, bucket: k });
    }
    return { buckets: b, rows };
  }

  // ---------------- Canadian payroll (CRA T4127 annualization method) ----------------
  // 2026 values. VERIFY against the CRA T4127 (Jan 2026) before live use; update each Jan & Jul.
  const PAYROLL_2026 = {
    year: 2026,
    cpp: { rate: 0.0595, baseRate: 0.0495, ympe: 74600, exemption: 3500, max: 4230.45 },
    cpp2: { rate: 0.04, yampe: 85000, max: 416.0 },
    ei: { rate: 0.0163, mie: 68900, max: 1123.07, employer: 1.4 },
    fed: { brackets: [[0, 0.14], [58523, 0.205], [117045, 0.26], [181440, 0.29], [258482, 0.33]], bpa: 16452, cea: 1501 },
    prov: {
      AB: { brackets: [[0, 0.08], [61200, 0.10], [154259, 0.12], [185111, 0.13], [246813, 0.14], [370220, 0.15]], bpa: 22769 },
    },
    minWage: { AB: 15.0 },
  };
  const progressive = (A, brackets) => {
    let tax = 0;
    for (let i = 0; i < brackets.length; i++) {
      const [lo, rate] = brackets[i];
      const hi = i + 1 < brackets.length ? brackets[i + 1][0] : Infinity;
      if (A > lo) tax += (Math.min(A, hi) - lo) * rate;
    }
    return tax;
  };

  /**
   * gross: taxable/pensionable/insurable earnings this period
   * P: pay periods per year; ytd: {gross, cpp, cpp2, ei}; emp: {province, td1_fed, td1_prov}
   */
  function payroll(gross, P, ytd = {}, emp = {}, R = PAYROLL_2026) {
    gross = r2(gross);
    const prov = emp.province || 'AB';
    const PT = R.prov[prov];
    if (!PT) throw new Error(`Payroll tables for ${prov} are not configured. Add them in Settings > Payroll.`);
    const y = { gross: +ytd.gross || 0, cpp: +ytd.cpp || 0, cpp2: +ytd.cpp2 || 0, ei: +ytd.ei || 0 };
    // CPP (base + first additional): T4127 C = min(max - YTD, rate x (PI - exemption/P)); the max enforces YMPE
    const cpp = r2(Math.max(0, Math.min(R.cpp.max - y.cpp, R.cpp.rate * (gross - R.cpp.exemption / P))));
    // CPP2 (second additional) on earnings between YMPE and YAMPE
    const cpp2Earn = Math.max(0, Math.min(y.gross + gross, R.cpp2.yampe) - Math.max(y.gross, R.cpp.ympe));
    const cpp2 = r2(Math.max(0, Math.min(cpp2Earn * R.cpp2.rate, R.cpp2.max - y.cpp2)));
    // EI
    const eiEarn = Math.max(0, Math.min(gross, R.ei.mie - y.gross));
    const ei = r2(Math.max(0, Math.min(eiEarn * R.ei.rate, R.ei.max - y.ei)));
    // Annual taxable income: enhanced CPP portion (F5A) and CPP2 are deductions from income
    const f5 = cpp * ((R.cpp.rate - R.cpp.baseRate) / R.cpp.rate) + cpp2;
    const A = Math.max(0, P * (gross - f5));

    const baseCppAnnual = Math.min(P * cpp * (R.cpp.baseRate / R.cpp.rate), R.cpp.max * (R.cpp.baseRate / R.cpp.rate));
    const eiAnnual = Math.min(P * ei, R.ei.max);
    const tcF = emp.td1_fed > 0 ? +emp.td1_fed : R.fed.bpa;
    const tcP = emp.td1_prov > 0 ? +emp.td1_prov : PT.bpa;
    const fedAnnual = Math.max(0, progressive(A, R.fed.brackets) - lowF * tcF - lowF * (baseCppAnnual + eiAnnual) - lowF * Math.min(A, R.fed.cea));
    const provAnnual = Math.max(0, progressive(A, PT.brackets) - lowP * tcP - lowP * (baseCppAnnual + eiAnnual));

  // Alberta overtime: greater of daily (>8h) or weekly (>44h) overtime, at 1.5x.
  function albertaOvertime(days /* [{date, hours}] within one week */) {
    const total = days.reduce((a, d) => a + (+d.hours || 0), 0);
    const daily = days.reduce((a, d) => a + Math.max(0, (+d.hours || 0) - 8), 0);

function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const [head, ...body] = rows.filter((r) => r.some((x) => x.trim()));
  return body.map((r) => Object.fromEntries(head.map((h, i) => [h.trim().toLowerCase().replace(/\s+/g, '_'), (r[i] || '').trim()])));
}

function pinKey(k) {

  else if (k === '⏎') return pinLogin(S.pin);
  else if (S.pin.length < 8) S.pin += k;
  $('#dots').textContent = '•'.repeat(S.pin.length) || ' ';
  if (S.pin.length >= 6 && S.pin === CFG.defaultAdminPin) pinLogin(S.pin);
}
document.addEventListener('keydown', (e) => { if ($('#pinbox') && /^[0-9]$/.test(e.key)) pinKey(e.key); else if ($('#pinbox') && e.key === 'Enter') pinKey('⏎'); else if ($('#pinbox') && e.key === 'Backspace') { S.pin = S.pin.slice(0, -1); $('#dots').textContent = '•'.repeat(S.pin.length) || ' '; } });
function pinLogin(pin) {
  const h = pinHash(pin);
  const pu = S.root.platformUsers.find((u) => u.pin_hash === h);
  if (pu) { S.user = { ...pu, platform: true, role: 'owner' }; Store.bindTenant(S.root.tenants[0]); return boot(); }
  for (const t of S.root.tenants) {
    const staff = (S.root.data[t.id]?.staff || []).find((u) => u.pin_hash === h && u.active !== false);

      if (t.status === 'suspended') return renderLogin('This account is suspended. Contact billing.');

    const d = await api('connectors', { action: 'vin_decode', vin });
    for (const k of ['year', 'make', 'model', 'trim', 'engine']) if (d[k] && $('#f_' + k)) $('#f_' + k).value = d[k];
    toast(d.error ? `Decoded with warning: ${d.error}` : `Decoded: ${d.year} ${d.make} ${d.model}`);
  } catch (e) {
    // Offline fallback: model year from VIN position 10
    const yc = 'ABCDEFGHJKLMNPRSTVWXY123456789', i = yc.indexOf(vin[9]?.toUpperCase());
    if (i >= 0 && $('#f_year')) $('#f_year').value = 2010 + i > new Date().getFullYear() + 1 ? 1980 + i : 2010 + i;
    toast('VIN service unavailable (' + e.message + '). Model year filled from VIN; enter make/model manually.', 'bad');
  }
}

// Generic list view with search, sort, CSV export
function listView(el, ent, opts = {}) {
  const E2 = ENTITIES[ent], key = 'lv_' + ent;
  const st = (S[key] ||= { q: '', sort: null, dir: 1 });
  const cols = (opts.cols || E2.cols).map((k) => fieldsOf(ent).find((f) => f.k === k)).filter(Boolean);
  let rows = (opts.rows || Store.list(ent)).filter(inLoc);
  if (st.q) { const q = st.q.toLowerCase(); rows = rows.filter((r) => fieldsOf(ent).some((f) => String(f.type === 'ref' ? refLabel(f.ref, r[f.k]) : r[f.k] ?? '').toLowerCase().includes(q))); }
  if (st.sort) rows = rows.slice().sort((a, b) => { const x = a[st.sort] ?? '', y = b[st.sort] ?? ''; return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), undefined, { numeric: true })) * st.dir; });
  el.innerHTML = `<div class="row" style="margin-bottom:10px">
      <input class="grow" style="max-width:360px" placeholder="Search ${esc(E2.label.toLowerCase())}s..." value="${esc(st.q)}" oninput="S['${key}'].q=this.value;clearTimeout(window._lvq);window._lvq=setTimeout(()=>go(S.view,S.sub),250)">
      <span class="muted small">${rows.length} records</span><span class="grow"></span>
      ${opts.extra || ''}
      <button class="btn sm" onclick="csvDownload('${ent}', Store.list('${ent}'))">Export CSV</button>
      ${can(S.view, 'edit') && !opts.noNew ? `<button class="btn primary" onclick="${opts.onNew || `editRecord('${ent}')`}">+ New ${esc(E2.label.toLowerCase())}</button>` : ''}
    </div>
    <div class="card tablewrap" style="padding:0">${rows.length ? `<table class="t"><thead><tr>${cols.map((c) => `<th class="${['money', 'number'].includes(c.type) ? 'num' : ''}" onclick="S['${key}'].sort='${c.k}';S['${key}'].dir*=-1;go(S.view,S.sub)">${esc(c.label)}${st.sort === c.k ? (st.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead>
      <tbody>${rows.slice(0, 500).map((r) => `<tr class="click" onclick="${opts.onOpen ? `${opts.onOpen}('${r.id}')` : `editRecord('${ent}','${r.id}')`}">${cols.map((c) => `<td class="${['money', 'number'].includes(c.type) ? 'num' : ''}">${cellVal(ent, c, r)}</td>`).join('')}</tr>`).join('')}</tbody></table>` : `<div class="empty">No ${esc(E2.label.toLowerCase())}s yet.</div>`}</div>`;
  $('input', el)?.focus();
  const inp = $('input', el); if (inp) inp.setSelectionRange(inp.value.length, inp.value.length);
}

async function distSearch(q, target) {
  const conns = Store.list('connectors').filter((c) => c.enabled && CONNECTORS.find((x) => x.id === c.connector)?.caps.includes('catalog_search')).map((c) => c.connector);
  if (!conns.length) return toast('Enable a distributor in Vendors & Integrations first', 'bad');
  const out = $('#pres') || $('#dsres');
  out.innerHTML = `<div class="muted">Searching ${conns.length} distributors...</div>`;
  const p = E.parseTire(q);
  let res;
  try { res = await api('connectors', { action: 'search', connectors: conns, q, size: p?.size || '' }); }
  catch (e) { res = { items: conns.flatMap((c) => offlineQuotes(c, q, p?.size || '')), errors: [{ error: 'Gateway offline: showing demo quotes (' + e.message + ')' }] }; }
  S.dsItems = res.items;
  out.innerHTML = `${res.errors?.length ? `<div class="flag small">${res.errors.map((e) => esc((e.connector ? e.connector + ': ' : '') + e.error)).join('<br>')}</div>` : ''}
    <table class="t"><tr><th>Distributor</th><th>Item</th><th>Warehouse</th><th>ETA</th><th class="num">Avail</th><th class="num">Cost</th><th></th></tr>
    ${res.items.map((it, i) => `<tr><td>${esc(it.vendor)}${it.demo ? ' <span class="pill warn">demo</span>' : ''}</td><td>${esc(it.description)}<div class="small muted mono">${esc(it.sku)}</div></td><td>${esc(it.warehouse)}</td><td>${esc(it.eta)}</td><td class="num">${esc(it.qty)}</td><td class="num"><b>${money(it.cost)}</b></td>
      <td class="row"><button class="btn sm" onclick="dsToPO(${i})">→ PO</button>${target === 'wo' ? `<button class="btn sm primary" onclick="dsToWO(${i})">Special order</button>` : ''}</td></tr>`).join('')}</table>`;
}
function offlineQuotes(conn, q, size) {
  const c = CONNECTORS.find((x) => x.id === conn);
  const seed = [...(conn + size + q)].reduce((a, ch) => a + ch.charCodeAt(0), 0);
  const brands = ['Michelin', 'Bridgestone', 'Goodyear', 'Toyo', 'Nokian', 'Continental'];
  return [0, 1].map((i) => ({ connector: conn, vendor: c?.name || conn, sku: conn.slice(0, 3).toUpperCase() + '-' + ((seed * (i + 3)) % 99999), description: `${brands[(seed + i) % 6]} ${size || q}`, cost: 95 + ((seed * (i + 7)) % 150), qty: (seed + i * 7) % 30, eta: i ? 'Next day' : 'Same day', warehouse: ['Edmonton', 'Calgary'][i], demo: true }));
}
function dsToWO(i) {
  const it = S.dsItems[i], m = ST().targetMargin || 30;
  S.wo.lines.push({ type: E.parseTire(it.description) || E.parseTire(it.size) ? 'tire' : 'part', sku: it.sku, desc: it.description + ' (special order)', qty: 4, price: r2(it.cost / (1 - m / 100)), cost: it.cost, special: { connector: it.connector, vendor: it.vendor }, taxable: true });
  closeModal(); woTabRender('lines'); toast(`Priced at ${m}% margin. Use "→ PO" to order it.`);
}

async function invoiceWO() {
  const w = S.wo;
  if (!w.customer_id) return toast('Select a customer first', 'bad');
  if (!w.lines.length) return toast('Add at least one line', 'bad');
  w.totals = E.totals(w.lines, taxCtx());
  const chk = E.estimateCheck(w.approvedTotal, w.totals.total, ST());
  if (!chk.ok) return modal('Authorization required', `<p>${w.approvedTotal ? `The total ${money(w.totals.total)} exceeds the authorized ${money(w.approvedTotal)} by more than the allowed ${money(chk.allowed)}.` : 'No customer authorization is on file for this work order.'}</p><p>Record the customer's authorization for the new amount before invoicing.</p>`, [{ label: 'Cancel' }, { label: 'Record authorization', cls: 'primary', onClick: () => setTimeout(recordApproval, 10) }], { narrow: true });
  const inv = await createInvoice({ customer_id: w.customer_id, vehicle_id: w.vehicle_id, wo_id: w.id, lines: w.lines, po: w.po, odometer: w.odometer_in, notes: [w.concern && 'Concern: ' + w.concern, w.cause && 'Cause: ' + w.cause, w.correction && 'Correction: ' + w.correction].filter(Boolean).join('\n') });
  w.status = 'Invoiced'; w.invoice_id = inv.id;
  await Store.save('workorders', w);
  const v = Store.get('vehicles', w.vehicle_id);
  if (v && w.odometer_in) { v.odometer = w.odometer_in; v.last_visit = today(); await Store.save('vehicles', v); }
  S.wo = null; go('workorders', w.id); takePayment(inv.id);
}
async function createInvoice({ customer_id, vehicle_id, wo_id, lines, po, notes, odometer }) {
  const c = Store.get('customers', customer_id);
  const totals = E.totals(lines, taxCtx());
  const days = c?.terms === 'Net 30' ? 30 : c?.terms === 'Net 15' ? 15 : 0;
  const inv = await Store.save('invoices', { number: nextNo('inv'), date: today(), due: addDays(today(), days), customer_id, vehicle_id, wo_id, lines, totals, balance: totals.total, status: 'Open', po, notes, odometer });
  await postJournal(E.postInvoice(inv));
  for (const l of lines) if (l.item_id) { const it = Store.get('inventory', l.item_id); if (it) { it.qty = (+it.qty || 0) - (+l.qty || 0); await Store.save('inventory', it); } }
  return inv;
}
function takePayment(invId) {
  const inv = Store.get('invoices', invId);
  if (!inv || inv.balance <= 0) return;
  const pay = Store.list('connectors').find((c) => c.enabled && CONNECTORS.find((x) => x.id === c.connector)?.caps.includes('payments'));
  modal(`Payment for ${inv.number}`, `<div class="grid g2"><div><label>Amount</label><input id="pamt" type="number" step="0.01" value="${inv.balance}"></div>
    <div><label>Method</label><select id="pmeth">${['debit', 'credit', 'cash', 'etransfer', 'cheque', 'financing', 'account'].map((m) => `<option>${m}</option>`).join('')}</select></div>
    <div><label>Date</label><input id="pdate" type="date" value="${today()}"></div><div><label>Reference</label><input id="pref" placeholder="Auth code / cheque #"></div></div>
    ${pay ? `<p class="small muted">Card terminal: ${esc(CONNECTORS.find((x) => x.id === pay.connector).name)} (sends the amount to the paired terminal when live).</p>` : ''}
    <p class="small muted">Balance due ${money(inv.balance)}. "account" leaves it on A/R for terms customers.</p>`,
    [{ label: 'Later' }, { label: 'Print invoice', onClick: () => { printInvoice(inv.id); return true; } }, { label: 'Record payment', cls: 'primary', onClick: async () => {
      const method = $('#pmeth').value;
      if (method === 'account') return;
      await recordPayment(inv, +$('#pamt').value, method, $('#pdate').value, $('#pref').value);
      toast('Payment recorded'); go(S.view, S.sub);
    } }], { narrow: true });
}
async function recordPayment(inv, amount, method, date = today(), ref = '') {
  amount = r2(amount);
  if (!(amount > 0)) { toast('Enter an amount', 'bad'); throw new Error('Invalid amount'); }
  const p = await Store.save('payments', { invoice_id: inv.id, date, amount, method, ref, location_id: inv.location_id });
  await postJournal(E.postPayment(p, inv.number));
  inv.balance = r2(inv.balance - amount); inv.status = inv.balance <= 0.004 ? 'Paid' : 'Partial';
  await Store.save('invoices', inv);
}

async function poSet(id, k, v) { const p = Store.get('purchase_orders', id); p[k] = v; await Store.save('purchase_orders', p); go('purchasing', id); }
async function poLine(id, i, k, v) { const p = Store.get('purchase_orders', id); if (k === null) p.lines.splice(i, 1); else p.lines[i][k] = v; p.total = r2(p.lines.reduce((a, l) => a + l.qty * l.cost, 0)); await Store.save('purchase_orders', p); go('purchasing', id); }
function poAddItem(id) {
  modal('Add inventory item', `<select id="poi">${Store.list('inventory').map((i) => `<option value="${i.id}">${esc(i.sku)} · ${esc(i.description)} (${i.qty} on hand)</option>`).join('')}</select><label style="margin-top:8px">Qty</label><input id="poq" type="number" value="4">`,
    [{ label: 'Add', cls: 'primary', onClick: async () => { const it = Store.get('inventory', $('#poi').value), p = Store.get('purchase_orders', id); p.lines.push({ sku: it.sku, desc: it.description, qty: +$('#poq').value, cost: +it.cost, item_id: it.id }); p.total = r2(p.lines.reduce((a, l) => a + l.qty * l.cost, 0)); await Store.save('purchase_orders', p); go('purchasing', id); } }], { narrow: true });
}
async function poSend(id) {
  const p = Store.get('purchase_orders', id), v = Store.get('vendors', p.vendor_id);
  if (!p.lines.length) return toast('PO has no lines', 'bad');
  if (v?.connector) {
    try { const r = await api('connectors', { action: 'order', connector: v.connector, po: p.number, lines: p.lines }); p.confirmation = r.confirmation || r.result?.confirmation || r.result?.id || 'Submitted'; if (r.demo) toast('Demo order (no live credentials yet)'); }
    catch (e) { p.confirmation = 'DEMO-' + Date.now().toString(36).toUpperCase(); toast('Gateway offline; marked sent with a demo confirmation', 'bad'); }
  }
  p.status = 'Sent'; p.sent_at = new Date().toISOString(); await Store.save('purchase_orders', p); go('purchasing', id);
}
async function poReceive(id) {
  const p = Store.get('purchase_orders', id), v = Store.get('vendors', p.vendor_id);
  for (const l of p.lines) {
    let it = l.item_id && Store.get('inventory', l.item_id);
    if (!it) it = await Store.save('inventory', { sku: l.sku, type: l.size ? 'tire' : 'part', description: l.desc, size: l.size || '', cost: l.cost, price: r2(l.cost / (1 - (ST().targetMargin || 30) / 100)), qty: 0, min: 0, max: 0, vendor_id: p.vendor_id });
    it.qty = (+it.qty || 0) + (+l.qty || 0); it.cost = l.cost; await Store.save('inventory', it); l.item_id = it.id;
  }
  const subtotal = r2(p.lines.reduce((a, l) => a + l.qty * l.cost, 0)), gst = r2(subtotal * E.taxFor(ST().province, ST().taxOverride).gst);
  const bill = await Store.save('bills', { number: p.confirmation || p.number, vendor_id: p.vendor_id, vendorName: v?.name || '', po_id: p.id, date: today(), due: addDays(today(), v?.terms === 'Net 15' ? 15 : v?.terms === 'COD' ? 0 : 30),
    lines: p.lines.map((l) => ({ account: l.size || Store.get('inventory', l.item_id)?.type === 'tire' ? '1200' : '1210', desc: l.desc, qty: l.qty, cost: l.cost })), subtotal, gst, total: r2(subtotal + gst), balance: r2(subtotal + gst), status: 'Open' });
  await postJournal(E.postBill(bill));
  p.status = 'Received'; p.received_at = new Date().toISOString(); p.bill_id = bill.id; await Store.save('purchase_orders', p);
  toast('Stock received and bill posted to A/P'); go('purchasing', id);
}

function ytdFor(empId, year, beforeDate) {
  const y = { gross: 0, cpp: 0, cpp2: 0, ei: 0, fedTax: 0, provTax: 0, net: 0, vacation: 0, hours: 0 };
  for (const run of Store.list('payruns')) if (run.payDate.startsWith(String(year)) && (!beforeDate || run.payDate < beforeDate)) for (const r of run.rows) if (r.employee_id === empId) for (const k of Object.keys(y)) y[k] = r2(y[k] + (+r[k] || 0));
  return y;
}
function computePayRow(e, start, end, P, adj = {}) {
  const R = payTables();
  const ts = Store.list('timesheets').filter((t) => t.employee_id === e.id && t.date >= start && t.date <= end && t.approved !== false);
  const weeks = {};
  for (const t of ts) (weeks[E.weekKey(t.date)] ||= []).push(t);
  let reg = 0, ot = 0;
  for (const w of Object.values(weeks)) { const o = E.albertaOvertime(w); reg += o.regular; ot += o.overtime; }
  let flagged = 0;
  for (const inv of Store.list('invoices').filter((i) => i.date >= start && i.date <= end)) for (const l of inv.lines) if (l.type === 'labour' && l.tech_id === e.id) flagged += +l.hours || 0;
  flagged = r2(flagged);
  let base = 0, sales = 0;
  if (e.pay_type === 'salary') base = r2((+e.rate || 0) / P);
  else if (e.pay_type === 'flat_rate') base = r2(flagged * (+e.flat_rate || 0));
  else base = r2(reg * (+e.rate || 0) + ot * (+e.rate || 0) * 1.5);
  if (+e.commission_pct > 0) { for (const inv of Store.list('invoices').filter((i) => i.date >= start && i.date <= end)) sales += inv.totals.subtotal; }
  const commission = r2(sales * (+e.commission_pct || 0) / 100 * (e.pay_type === 'commission' ? 1 : 0.25)); // advisors: shared pool (25% weight) - configurable policy
  const bonus = +adj.bonus || 0;
  const vacation = r2((base + commission + bonus) * (+e.vacation_pct || 0) / 100);
  const gross = r2(base + commission + bonus + vacation);
  const y = ytdFor(e.id, end.slice(0, 4), end);
  const calc = E.payroll(gross, P, y, e, R);
  const flags = [];
  const clocked = r2(reg + ot), minW = R.minWage?.[e.province];
  if (e.pay_type === 'flat_rate' && minW && clocked > 0 && base < clocked * minW) flags.push(`Flat-rate pay ${money(base)} is below minimum wage for ${clocked} clocked hours (${money(clocked * minW)}). Top-up required.`);
  if (ot > 0 && e.pay_type !== 'hourly') flags.push(`${ot} overtime hours recorded on a ${e.pay_type} employee: confirm the overtime agreement.`);
  return { employee_id: e.id, name: e.name, pay_type: e.pay_type, hours: clocked, regular: r2(reg), overtime: r2(ot), flagged, base, commission, bonus, vacation, ...calc, flags };
}

function techEfficiency(from, to) {
  return Store.list('employees').map((e) => {
    let flagged = 0, sales = 0;
    for (const i of Store.list('invoices').filter((x) => x.date >= from && x.date <= to)) for (const l of i.lines) if (l.type === 'labour' && l.tech_id === e.id) { flagged += +l.hours || 0; sales += E.lineAmount(l); }
    const clocked = Store.list('timesheets').filter((t) => t.employee_id === e.id && t.date >= from && t.date <= to).reduce((a, t) => a + (+t.hours || 0), 0);
    return { name: e.name, position: e.position, flagged: r2(flagged), clocked: r2(clocked), efficiency: clocked ? Math.round((flagged / clocked) * 100) : 0, labourSales: r2(sales) };
  }).filter((x) => x.flagged || x.clocked);
}

    el.innerHTML = `<div class="card"><h3>Labour rates</h3>${s.labourRates.map((r, i) => `<div class="row" style="margin-bottom:6px"><input value="${esc(r.name)}" onchange="ST().labourRates[${i}].name=this.value;saveSet()" style="max-width:260px"><input type="number" step="0.01" value="${r.rate}" onchange="ST().labourRates[${i}].rate=+this.value;saveSet()" style="max-width:140px"><button class="btn sm danger" onclick="ST().labourRates.splice(${i},1);saveSet();go('settings','pricing')">✕</button></div>`).join('')}
      <button class="btn sm" onclick="ST().labourRates.push({name:'New rate',rate:0});saveSet();go('settings','pricing')">+ Rate</button></div>
      <div class="card grid g3" style="margin-top:12px"><div><label>Fleet markup over cost %</label><input type="number" value="${s.markups.fleet}" ${bindSet('ST().markups', 'fleet', 1)}></div><div><label>Wholesale markup over cost %</label><input type="number" value="${s.markups.wholesale}" ${bindSet('ST().markups', 'wholesale', 1)}></div><div><label>Target gross margin %</label><input type="number" value="${s.targetMargin}" ${bindSet('ST()', 'targetMargin', 1)}></div></div>
      <p class="small muted">Retail customers pay list price. Fleet and wholesale customers get cost-plus pricing automatically on work orders and POS. Special-order items are priced to the target margin.</p>`;
  },
  workflow(el) {
    const s = ST();
    const listEd = (key, title, hint) => `<div class="card"><h3>${title}</h3><p class="small muted">${hint}</p><textarea style="min-height:160px" onchange="ST().${key}=this.value.split('\\n').map(x=>x.trim()).filter(Boolean);saveSet()">${esc(s[key].join('\n'))}</textarea></div>`;
    el.innerHTML = `<div class="grid g2">${listEd('woStatuses', 'Work order statuses', 'One per line, in order. Keep "Invoiced" last.')}${listEd('inspection', 'Digital inspection checklist', 'One item per line. Make templates for fleet, tire-only or full multi-point.')}${listEd('dealStages', 'CRM deal stages', 'One per line. Keep "Won" and "Lost".')}${listEd('bays', 'Service bays', 'Used by the scheduler for capacity.')}</div>
      <div class="card grid g4" style="margin-top:12px"><div><label>WO prefix</label><input value="${esc(s.numbering.wo)}" ${bindSet('ST().numbering', 'wo')}></div><div><label>Invoice prefix</label><input value="${esc(s.numbering.inv)}" ${bindSet('ST().numbering', 'inv')}></div><div><label>PO prefix</label><input value="${esc(s.numbering.po)}" ${bindSet('ST().numbering', 'po')}></div><div><label>Next invoice #</label><input type="number" value="${s.numbering.next.inv}" ${bindSet('ST().numbering.next', 'inv', 1)}></div></div>`;
  },
  fields(el) {
    const cf = (ST().customFields ||= {});
    el.innerHTML = `<div class="card"><p class="muted">Add your own fields to any record. They show up on forms, lists, search and CSV import/export, and are stored per tenant without database changes.</p>
      ${Object.keys(ENTITIES).map((ent) => `<h3 style="margin-top:14px">${esc(ENTITIES[ent].label)}s</h3>${(cf[ent] || []).map((f, i) => `<div class="row" style="margin-bottom:6px"><span class="mono small" style="width:140px">${esc(f.k)}</span><b class="grow">${esc(f.label)}</b><span class="pill">${esc(f.type || 'text')}</span><button class="btn sm danger" onclick="ST().customFields['${ent}'].splice(${i},1);saveSet();go('settings','fields')">✕</button></div>`).join('') || '<div class="small muted">None</div>'}
        <div class="row"><input placeholder="Field label" id="cfl_${ent}" style="max-width:240px"><select id="cft_${ent}" style="width:auto">${['text', 'number', 'money', 'date', 'bool', 'select', 'textarea'].map((t) => `<option>${t}</option>`).join('')}</select><input placeholder="Options (comma) for select" id="cfo_${ent}" style="max-width:240px"><button class="btn sm" onclick="addField('${ent}')">+ Add</button></div>`).join('')}</div>`;
  },
  users(el) {
    const p = (ST().perms ||= defaultPerms());
    const staff = Store.list('staff');
    el.innerHTML = `<div class="card"><div class="row"><h3 class="grow">Staff logins</h3><button class="btn primary sm" onclick="staffEdit()">+ User</button></div>
      <table class="t"><tr><th>Name</th><th>Role</th><th>Login</th><th>Active</th><th></th></tr>${staff.map((u) => `<tr><td>${esc(u.name)}</td><td>${esc(u.role)}</td><td>${u.email ? esc(u.email) : '<span class="muted">PIN</span>'}</td><td>${u.active !== false ? '✓' : ''}</td><td><button class="btn sm" onclick="staffEdit('${u.id}')">Edit</button></td></tr>`).join('')}</table>
      <p class="small muted">${DEMO ? 'Demo mode uses PIN logins.' : 'Cloud mode: users are invited by email (Supabase Auth) and linked to this shop with their role.'} Plan limit: ${PLANS[S.tenant.plan_id].users} users.</p></div>
      <div class="card tablewrap" style="margin-top:12px"><h3>Role permissions</h3><table class="t"><tr><th>Module</th>${ROLES.map((r) => `<th>${esc(r)}</th>`).join('')}</tr>${MODULES.filter((m) => m.k !== 'platform').map((m) => `<tr><td>${esc(m.label)}</td>${ROLES.map((r) => `<td><select style="width:auto;padding:3px" onchange="ST().perms['${r}']['${m.k}']=this.value;saveSet()" ${r === 'owner' ? 'disabled' : ''}>${['none', 'view', 'edit'].map((l) => `<option ${p[r]?.[m.k] === l ? 'selected' : ''}>${l}</option>`).join('')}</select></td>`).join('')}</tr>`).join('')}</table>
      <button class="btn sm" style="margin-top:8px" onclick="ST().perms=defaultPerms();saveSet();go('settings','users')">Reset to defaults</button></div>`;
  },
  modules(el) {
    const plan = PLANS[S.tenant.plan_id];
    el.innerHTML = `<div class="card"><p class="muted">Turn modules off to simplify the app for your team. Modules outside your plan are shown locked.</p>${MODULES.filter((m) => !['platform', 'settings', 'dashboard'].includes(m.k)).map((m) => { const inPlan = plan.modules.includes(m.k); return `<label class="row" style="color:var(--ink);font-size:14px;padding:4px 0"><input type="checkbox" ${inPlan && ST().modules[m.k] !== false ? 'checked' : ''} ${inPlan ? '' : 'disabled'} onchange="ST().modules['${m.k}']=this.checked;saveSet();renderShell()"> ${m.icon} ${esc(m.label)} ${inPlan ? '' : '<span class="pill warn">upgrade</span>'}</label>`; }).join('')}</div>`;
  },
  billing(el) {
    el.innerHTML = `<div class="grid g4">${Object.entries(PLANS).map(([k, p]) => `<div class="card" style="${k === S.tenant.plan_id ? 'border-color:var(--brand);border-width:2px' : ''}"><h3>${esc(p.name)}</h3><div class="kpi"><div class="v">${p.price ? money(p.price) : 'Quote'}</div><div class="l">${p.price ? 'per location / month' : 'banner & distributor groups'}</div></div>
      <ul class="small" style="padding-left:18px">${[`${p.users} users`, `AI: ${p.ai < 0 ? 'unlimited' : p.ai + '/mo'}`, `Integrations: ${p.connectors < 0 ? 'unlimited' : p.connectors}`, ...['accounting', 'payroll', 'crm', 'storage'].filter((m) => p.modules.includes(m)).map((m) => MODULES.find((x) => x.k === m).label)].map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
      ${k === S.tenant.plan_id ? '<span class="pill good">Current plan</span>' : `<button class="btn primary sm" onclick="upgrade('${k}')">${p.price ? 'Switch' : 'Contact sales'}</button>`}</div>`).join('')}</div>
      <p class="small muted">Status: ${statusPill(S.tenant.status)} · Prices in CAD plus GST/HST. Billing runs through Stripe; cancel anytime.</p>`;
  },
  data(el) {
    el.innerHTML = `<div class="card"><h3>Export</h3><p class="muted">Download all of this tenant's data (JSON). You own your data.</p><button class="btn" onclick="exportAll()">Download full backup</button>
      <h3 style="margin-top:16px">Privacy (PIPA / PIPEDA)</h3><ul class="small"><li>Cloud data is hosted in Canada (Supabase ca-central-1), isolated per tenant by row-level security, with every change written to an audit log.</li><li>SINs are masked in the UI and restricted to owner, manager and accountant roles.</li><li>Customer access requests: use "Export customer" on the customer record (or this backup) to respond within 45 days.</li><li>Breaches posing a real risk of significant harm must be reported to the Alberta OIPC and affected people without unreasonable delay.</li></ul>
      ${DEMO ? `<h3 style="margin-top:16px">Demo data</h3><button class="btn danger" onclick="resetDemo()">Reset demo to sample data</button>` : ''}</div>`;
  },
};
function addField(ent) {
  const label = $('#cfl_' + ent).value.trim(); if (!label) return;
  const type = $('#cft_' + ent).value, k = 'x_' + label.toLowerCase().replace(/[^a-z0-9]+/g, '_').slice(0, 30);
  (ST().customFields[ent] ||= []).push({ k, label, type, options: type === 'select' ? ['', ...$('#cfo_' + ent).value.split(',').map((x) => x.trim()).filter(Boolean)] : undefined });
  saveSet('Field added'); go('settings', 'fields');
}
function staffEdit(id) {
  const u = id ? Store.get('staff', id) : { role: 'advisor', active: true };
  if (!id && Store.list('staff').filter((x) => x.active !== false).length >= PLANS[S.tenant.plan_id].users) return toast('User limit reached for your plan', 'bad');
  modal(id ? 'Edit user' : 'New user', `<div class="grid g2"><div><label>Name</label><input id="sun" value="${esc(u.name || '')}"></div><div><label>Role</label><select id="sur">${ROLES.map((r) => `<option ${r === u.role ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
    <div><label>${DEMO ? 'PIN (4-8 digits)' : 'Quick-switch PIN (optional)'}</label><input id="sup" type="password" inputmode="numeric" placeholder="${id ? 'unchanged' : ''}"></div><div><label>Email ${DEMO ? '(optional)' : '(sends invite)'}</label><input id="sue" type="email" value="${esc(u.email || '')}"></div>
    <label class="row" style="color:var(--ink)"><input type="checkbox" id="sua" ${u.active !== false ? 'checked' : ''}> Active</label></div>`,
    [{ label: 'Cancel' }, { label: 'Save', cls: 'primary', onClick: async () => {
      const pin = $('#sup').value;
      if (pin && !/^\d{4,8}$/.test(pin)) { toast('PIN must be 4-8 digits', 'bad'); return true; }
      if (pin && (Store.list('staff').some((x) => x.id !== id && x.pin_hash === pinHash(pin)) || pin === CFG.defaultAdminPin)) { toast('PIN already in use', 'bad'); return true; }
      if (DEMO && !id && !pin) { toast('Set a PIN', 'bad'); return true; }
      if (!DEMO) {
        if (!$('#sue').value) { toast('Email required to invite a user', 'bad'); return true; }
        try { await api('members', { email: $('#sue').value, role: $('#sur').value, name: $('#sun').value, active: $('#sua').checked }); toast('Invite sent'); }
        catch (e) { toast(e.message, 'bad'); return true; }
      }
      await Store.save('staff', { ...u, name: $('#sun').value, role: $('#sur').value, email: $('#sue').value, active: $('#sua').checked, ...(pin ? { pin_hash: pinHash(pin) } : {}) });
      toast('User saved'); go('settings', 'users');
    } }], { narrow: true });
}
async function upgrade(plan) {
  if (!PLANS[plan].price) return modal('Distribution / Banner', '<p>Multi-store groups, banners and distributors get group admin, consolidated reporting and a dealer B2B portal. Contact sales for a quote.</p>', [{ label: 'Close' }], { narrow: true });
  if (DEMO) { S.tenant.plan_id = plan; await Store.saveTenant(); toast(`Demo: switched to ${PLANS[plan].name}`); return go('settings', 'billing'); }
  try { const r = await api('billing', { planId: plan }); location.href = r.url; } catch (e) { toast(e.message, 'bad'); }
}
function exportAll() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ tenant: S.tenant, data: S.data }, null, 2)], { type: 'application/json' })); a.download = `${S.tenant.slug || 'shop'}-backup-${today()}.json`; a.click(); }
async function resetDemo() { if (await confirmBox('Erase all demo changes and reload sample data?')) { try { localStorage.removeItem(KEY); } catch { /* ignore */ } S.root = seedDemo(); Store.persistDemo(); logout(); } }

// ---------------- Platform admin (SaaS operator) ----------------
VIEWS.platform = (el) => {
  const ts = S.root.tenants;
  const mrr = ts.filter((t) => t.status === 'active').reduce((a, t) => a + (PLANS[t.plan_id]?.price || 0) * Math.max(1, (DEMO ? S.root.data[t.id]?.locations?.length : 1) || 1), 0);
  el.innerHTML = `<div class="grid g4"><div class="card kpi"><div class="l">Tenants</div><div class="v">${ts.length}</div></div><div class="card kpi"><div class="l">Active MRR (CAD)</div><div class="v">${money(mrr)}</div></div><div class="card kpi"><div class="l">ARR run-rate</div><div class="v">${money(mrr * 12)}</div></div><div class="card kpi"><div class="l">In trial</div><div class="v">${ts.filter((t) => t.status === 'trial').length}</div></div></div>
    <div class="row" style="margin:12px 0"><span class="grow"></span><button class="btn primary" onclick="newTenant()">+ New tenant</button></div>
    <div class="card tablewrap" style="padding:0"><table class="t"><tr><th>Tenant</th><th>Province</th><th>Plan</th><th>Status</th><th class="num">Locations</th><th class="num">Invoices</th><th>Created</th><th></th></tr>${ts.map((t) => { const d = DEMO ? S.root.data[t.id] || {} : t.id === S.tenant.id ? S.data : {}; return `<tr><td><b>${esc(t.name)}</b><div class="small muted mono">${esc(t.id)}</div></td><td>${esc(t.province)}</td>
      <td><select style="width:auto" onchange="tenantSet('${t.id}','plan_id',this.value)">${Object.keys(PLANS).map((p) => `<option value="${p}" ${p === t.plan_id ? 'selected' : ''}>${esc(PLANS[p].name)}</option>`).join('')}</select></td>
      <td><select style="width:auto" onchange="tenantSet('${t.id}','status',this.value)">${['trial', 'active', 'past_due', 'suspended', 'cancelled'].map((s) => `<option ${s === t.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
      <td class="num">${d.locations?.length ?? '-'}</td><td class="num">${d.invoices?.length ?? '-'}</td><td>${fdate(t.created_at)}</td><td><button class="btn sm" onclick="switchTenant('${t.id}')">Enter</button></td></tr>`; }).join('')}</table></div>
    <div class="card" style="margin-top:12px"><h3>Plan entitlements</h3><div class="tablewrap"><table class="t"><tr><th>Module</th>${Object.values(PLANS).map((p) => `<th>${esc(p.name)}</th>`).join('')}</tr>${MODULES.filter((m) => m.k !== 'platform').map((m) => `<tr><td>${esc(m.label)}</td>${Object.values(PLANS).map((p) => `<td>${p.modules.includes(m.k) ? '✓' : ''}</td>`).join('')}</tr>`).join('')}</table></div></div>`;
};
async function tenantSet(id, k, v) {
  const t = S.root.tenants.find((x) => x.id === id); t[k] = v;
  if (DEMO) Store.persistDemo(); else { const { error } = await S.sb.from('tenants').update({ [k]: v }).eq('id', id); if (error) return toast(error.message, 'bad'); }
  toast('Tenant updated'); if (id === S.tenant.id) renderShell();
}
function newTenant() {
  modal('New tenant', `<div class="grid g2"><div><label>Business name</label><input id="ntn"></div><div><label>Province</label><select id="ntp">${PROVS.map((p) => `<option ${p === 'AB' ? 'selected' : ''}>${p}</option>`).join('')}</select></div>
    <div><label>Plan</label><select id="ntl">${Object.entries(PLANS).map(([k, p]) => `<option value="${k}">${esc(p.name)}</option>`).join('')}</select></div><div><label>Owner PIN (demo) / email (cloud)</label><input id="nto"></div>
    <label class="row" style="color:var(--ink)"><input type="checkbox" id="nts" checked> Load sample data</label></div>`,
    [{ label: 'Cancel' }, { label: 'Create', cls: 'primary', onClick: async () => {
      const name = $('#ntn').value.trim(); if (!name) { toast('Name required', 'bad'); return true; }
      if (!DEMO) { const { data, error } = await S.sb.rpc('create_tenant', { p_name: name, p_province: $('#ntp').value, p_plan: $('#ntl').value }); if (error) { toast(error.message, 'bad'); return true; } const { data: t } = await S.sb.from('tenants').select('*').eq('id', data).single(); S.root.tenants.push(t); return go('platform'); }
      const t = { id: uid('ten'), name, slug: name.toLowerCase().replace(/[^a-z0-9]+/g, '-'), plan_id: $('#ntl').value, status: 'trial', province: $('#ntp').value, created_at: new Date().toISOString(), settings: defaultSettings(name, $('#ntp').value) };
      S.root.tenants.push(t);
      S.root.data[t.id] = $('#nts').checked ? seedTenant(t, {}) : Object.fromEntries(COLLECTIONS.map((c) => [c, []]));
      if (!$('#nts').checked) S.root.data[t.id].accounts = DEFAULT_COA.map(([code, nm, type]) => ({ id: 'acc_' + code, code, name: nm, type }));
      const pin = $('#nto').value.trim();
      if (/^\d{4,8}$/.test(pin)) S.root.data[t.id].staff.push({ id: uid('sta'), name: name + ' Owner', role: 'owner', pin_hash: pinHash(pin), active: true });
      Store.persistDemo(); toast('Tenant created'); go('platform');
    } }], { narrow: true });
}

// ---------------- Boot ----------------
(async function start() {
  if (DEMO) { Store.loadDemo(); renderLogin(); return; }
  try {
    await loadSupabase();
    S.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
    const { data } = await S.sb.auth.getSession();
    if (data.session) { S.session = data.session; await cloudEnter(); } else renderLogin();
    S.sb.auth.onAuthStateChange((_e, sess) => { S.session = sess; });
  } catch (e) { $('#root').innerHTML = `<div class="flag bad" style="margin:20px">Could not reach the ShopStack cloud: ${esc(e.message)}</div>`; }
})();
</script>
</body>
</html>
