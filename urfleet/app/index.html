<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UrFleet Fleet Manager</title>
<meta name="description" content="UrFleet managed print fleet management — DCA monitoring, supplies, alerts, meter billing to Xero/QuickBooks, HubSpot CRM sync.">
<meta name="robots" content="noindex,nofollow">

<style>
:root{
  --navy:#0D1B2A;--navy2:#13263b;--blue:#1D7FC4;--blue-d:#1567a2;--amber:#F4A225;
  --bg:#f3f6f9;--card:#fff;--ink:#14212e;--mut:#5b6b7b;--line:#dfe6ed;--soft:#eef3f8;
  --crit:#d64545;--warn:#e8a317;--info:#1D7FC4;--ok:#2e9e62;--blk:#6b7280;
  --r:10px;--sh:0 1px 2px rgba(13,27,42,.06),0 2px 8px rgba(13,27,42,.05);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color-scheme:light;
}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:0 0 8px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--navy);color:#cfd9e3;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;color:#fff}
.brand b{font-size:17px;letter-spacing:.2px}.brand small{display:block;color:#8fa6bb;font-size:11px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 18px;color:#cfd9e3;border-left:3px solid transparent;font-weight:500}
.nav a:hover{background:var(--navy2);text-decoration:none;color:#fff}
.nav a.on{background:var(--navy2);border-left-color:var(--amber);color:#fff}
.nav svg{width:18px;height:18px;fill:currentColor;opacity:.9}
.nav .badge{margin-left:auto}
.side .foot{margin-top:auto;padding:14px 18px;font-size:11px;color:#7f97ad}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .search{flex:1;max-width:460px;position:relative}
.top .search input{width:100%}
.sres{position:absolute;top:38px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--sh);max-height:360px;overflow:auto;z-index:30}
.sres a{display:block;padding:8px 12px;border-bottom:1px solid var(--soft);color:var(--ink)}.sres a:hover{background:var(--soft);text-decoration:none}
.content{padding:20px;max-width:1500px;width:100%}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--mut);white-space:nowrap}
.pill.demo{background:#fff4e0;color:#9a5b00}.pill.live{background:#e3f4ea;color:#1d6b42}
.menu-btn{display:none;background:none;border:0;font-size:22px;cursor:pointer;color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:16px;min-width:0}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi{padding:14px 16px}.kpi .l{color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}.kpi .v{font-size:26px;font-weight:700;margin-top:4px}.kpi .s{color:var(--mut);font-size:12px}
.tile{display:flex;align-items:center;gap:12px;cursor:pointer;text-decoration:none!important;color:var(--ink)}
.tile:hover{border-color:var(--blue)}.tile .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}.ph .sp{flex:1}
.ph .sub{color:var(--mut);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:8px;padding:7px 13px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--blue-d);text-decoration:none}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--blue);border-color:var(--line)}.btn.ghost:hover{border-color:var(--blue);background:#f6faff}
.btn.amber{background:var(--amber);border-color:var(--amber);color:var(--navy)}.btn.danger{background:#fff;color:var(--crit);border-color:#f0c9c9}
.btn.sm{padding:4px 9px;font-size:12px}.btn.xs{padding:2px 7px;font-size:11px}
input,select,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #b9dbf3;border-color:var(--blue)}
textarea{width:100%;min-height:70px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mut)}
label.f input,label.f select,label.f textarea{font-weight:400;color:var(--ink);font-size:14px}
label.ck{display:flex;align-items:center;gap:8px;font-size:13px}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.fg .wide{grid-column:1/-1}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs a{padding:9px 14px;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--blue);border-bottom-color:var(--blue)}.tabs a:hover{text-decoration:none;color:var(--ink)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{background:#f7f9fb;text-align:left;font-weight:600;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
.t th.sortable{cursor:pointer}.t th.sortable:hover{color:var(--ink)}
.t td{padding:7px 10px;border-bottom:1px solid var(--soft);vertical-align:middle}
.t tr:last-child td{border-bottom:0}.t tbody tr:hover{background:#fafcfe}
.t .num{text-align:right;font-variant-numeric:tabular-nums}.t .cb{width:30px}.t .empty{text-align:center;color:var(--mut);padding:26px}
.t tr.rej td{background:#fff6f6;color:#a33}.t tr.sub td{background:#fbfcfd;color:var(--mut);font-size:12px}
.more{margin-top:8px}
.hd{width:10px;height:10px;border-radius:50%;display:inline-block}
.h-critical{background:var(--crit)}.h-flagged{background:var(--warn)}.h-informational{background:var(--info)}.h-healthy{background:var(--ok)}.h-blocked{background:var(--blk)}
.badge{display:inline-block;min-width:18px;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:700;background:var(--crit);color:#fff;text-align:center}
.tag{display:inline-block;padding:1px 8px;border-radius:5px;font-size:11px;font-weight:600;background:var(--soft);color:var(--mut);white-space:nowrap}
.tag.ok{background:#e3f4ea;color:#1d6b42}.tag.warn{background:#fff3d6;color:#8a5a00}.tag.crit{background:#fde5e5;color:#a12b2b}.tag.info{background:#e3f0fa;color:#145c8f}
.lvl{display:inline-flex;align-items:center;gap:6px;min-width:110px}
.lvl .b{flex:1;height:8px;border-radius:4px;background:#e8edf2;overflow:hidden;min-width:50px}.lvl .b i{display:block;height:100%}
.ic{background:none;border:0;cursor:pointer;padding:2px 3px;font-size:15px;opacity:.35;filter:grayscale(1)}.ic.on{opacity:1;filter:none}.ic:hover{opacity:.8}
.muted{color:var(--mut)}.small{font-size:12px}.mono{font-family:Consolas,Menlo,monospace;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}.right{text-align:right}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:5px 16px;font-size:13px}.kv dt{color:var(--mut)}.kv dd{margin:0;word-break:break-word}
.hbar{display:grid;grid-template-columns:140px 1fr 70px;gap:8px;align-items:center;font-size:12px;margin:5px 0}
.hbar .b{height:12px;background:#e8edf2;border-radius:6px;overflow:hidden}.hbar .b i{display:block;height:100%;background:var(--blue)}
.modal-bg{position:fixed;inset:0;background:rgba(13,27,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:100;overflow:auto}
.modal{background:#fff;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.25);width:100%;max-width:640px}
.modal.wide{max-width:960px}
.modal header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}.modal header h2{margin:0;flex:1}
.modal .mb{padding:18px;max-height:70vh;overflow:auto}.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--mut)}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;box-shadow:var(--sh);max-width:380px;font-size:13px}
.toast.err{background:var(--crit)}.toast.ok{background:var(--ok)}
.note{background:#fff8e8;border:1px solid #f6dfa6;border-radius:8px;padding:10px 12px;font-size:13px;color:#6b4a00}
.note.blue{background:#eef6fc;border-color:#cfe4f5;color:#174f78}
pre.code{background:var(--navy);color:#e6eef6;padding:12px;border-radius:8px;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#173353,var(--navy) 60%);padding:16px}
.login .box{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dots{display:flex;justify-content:center;gap:10px;margin:18px 0}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--blue)}.dots i.f{background:var(--blue)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pad button{padding:14px;font-size:20px;border-radius:10px;border:1px solid var(--line);background:#f8fafc;cursor:pointer;font-weight:600;color:var(--navy)}
.pad button:hover{background:#eef5fb}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.cat{cursor:pointer}.cat:hover{border-color:var(--blue)}.cat ul{margin:6px 0 0;padding-left:18px}.cat li{margin:2px 0}
.steps{counter-reset:s;padding-left:0;list-style:none}.steps li{counter-increment:s;margin:0 0 10px 30px;position:relative}
.steps li:before{content:counter(s);position:absolute;left:-30px;top:0;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;display:grid;place-items:center;font-weight:700}
@media (max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}.side{position:fixed;left:-250px;width:240px;z-index:60;transition:left .2s}.side.open{left:0}
  .menu-btn{display:block}.g2,.g3,.g4,.g5{grid-template-columns:1fr}.content{padding:14px 16px}.top{padding:8px 16px}
  .top .ctx{display:none}.hbar{grid-template-columns:100px 1fr 60px}
}
@media print{.side,.top,.bar,.btn,.tabs{display:none!important}.app{display:block}.card{box-shadow:none}}
</style>

const DAY = 86400000;

  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function csvCell(v) { if (v == null) return ''; const s = String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function toCSV(headers, rows) { return [headers.map(csvCell).join(','), ...rows.map(r => r.map(csvCell).join(','))].join('\r\n'); }
function parseCSV(text) {

function closeModal() { const m = $('#modal'); if (m) m.remove(); }

  const f = typeof sel === 'string' ? $(sel) : sel; const o = {}; if (!f) return o;
  f.querySelectorAll('input,select,textarea').forEach(el => {

const DB = {

  async init() {

  async loadAll() {

  async insert(t, rows) {

      const out = [];

        const { data, error } = await SB.from(t).insert(arr.slice(i, i + 500)).select();
        if (error) throw new Error(`${t}: ${error.message}`);
        out.push(...data);
      }

  },
  async update(t, id, patch) {

      const { data, error } = await SB.from(t).update(patch).eq(keyCol, id).select();

  async upsertSetting(key, value) {

    const r = T.app_settings.find(x => x.key === key); if (r) r.value = value; else T.app_settings.push({ key, value }); DB.persist();

  /** meter reads for devices in a time window (accepted + rejected) */
  async reads(deviceIds, from, to) {

  async lines(runId) {

function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('Could not load ' + src)); document.head.appendChild(s); }); }
const setting = (k, def = {}) => Object.assign({}, def, (T.app_settings || []).find(x => x.key === k)?.value || {});

// ---------- indexes ----------
const IDX = {};
function reindex() {
  IDX.acc = new Map(T.accounts.map(a => [a.id, a]));
  IDX.dev = new Map(T.devices.map(d => [d.id, d]));
  IDX.dca = new Map(T.dca_installs.map(d => [d.id, d]));
  IDX.con = new Map(T.contracts.map(c => [c.id, c]));
  IDX.sup = groupBy(T.device_supplies, 'device_id');
  IDX.alertsOpen = groupBy(T.alerts.filter(a => a.status !== 'closed' && a.device_id), 'device_id');
  IDX.events = groupBy(T.service_events, 'device_id');
  IDX.children = groupBy(T.accounts.filter(a => a.parent_id), 'parent_id');
  IDX.devByAcc = groupBy(T.devices, 'account_id');
}
function groupBy(arr, k) { const m = new Map(); for (const x of arr) { const v = x[k]; if (!m.has(v)) m.set(v, []); m.get(v).push(x); } return m; }
const acctName = id => IDX.acc.get(id)?.name || '—';
function descendants(id) { const out = [id]; for (const c of IDX.children.get(id) || []) out.push(...descendants(c.id)); return out; }
function ctxAccounts() { return S.ctx ? new Set(descendants(S.ctx)) : null; }
function inCtx(accountId) { const s = ctxAccounts(); return !s || s.has(accountId); }
const MARKERS = new Set(['toner', 'ink']);
function markers(d) { return (IDX.sup.get(d.id) || []).filter(s => MARKERS.has(s.supply_type)); }
function lowestMarker(d) { const m = markers(d).filter(s => s.level_pct != null); return m.length ? m.reduce((a, b) => (+a.level_pct <= +b.level_pct ? a : b)) : null; }
function soonestEmpty(d) { const m = (IDX.sup.get(d.id) || []).filter(s => s.est_empty_date); return m.length ? m.reduce((a, b) => (a.est_empty_date <= b.est_empty_date ? a : b)) : null; }
function health(d) {
  if (d.is_blocked) return 'blocked';
  const al = IDX.alertsOpen.get(d.id) || [];
  if (al.some(a => a.severity === 'critical')) return 'critical';
  if (d.flagged || al.some(a => a.severity === 'warning')) return 'flagged';
  if (al.length) return 'informational';
  return 'healthy';
}
const isStale = (d, days = 3) => !d.last_audit || Date.now() - new Date(d.last_audit) > days * DAY;
const dcaStale = (x, days = 3) => x.status !== 'disabled' && (!x.last_reported || Date.now() - new Date(x.last_reported) > days * DAY);
const HEALTH = { critical: ['Critical', 'var(--crit)'], flagged: ['Flagged', 'var(--warn)'], informational: ['Informational', 'var(--info)'], healthy: ['Healthy', 'var(--ok)'], blocked: ['Blocked', 'var(--blk)'] };
function lvlBar(p) {

  const c = p <= 5 ? 'var(--crit)' : p <= 15 ? 'var(--warn)' : p <= 30 ? '#c9b02a' : 'var(--ok)';
  return `<span class="lvl"><span class="b"><i style="width:${Math.max(2, p)}%;background:${c}"></i></span><b>${F.pct(p)}</b></span>`;
}
const sevTag = s => `<span class="tag ${s === 'critical' ? 'crit' : s === 'warning' ? 'warn' : 'info'}">${esc(s)}</span>`;

function estEmpty(s, d, at = new Date()) {
  if (s.level_pct == null) return null;
  if (+s.level_pct <= 0) return ymd(at);
  if (s.ref_level != null && s.ref_at) {
    const days = (at - new Date(s.ref_at)) / DAY, drop = s.ref_level - s.level_pct;
    if (days >= 2 && drop > 0) return ymd(new Date(+at + s.level_pct / (drop / days) * DAY));
  }
  const amv = s.color && s.color !== 'black' ? d.amv_color : s.supply_type === 'drum' ? d.amv_total : (d.amv_mono || d.amv_total);
  if (s.yield_pages && amv > 0) return ymd(new Date(+at + (s.yield_pages * s.level_pct / 100) / (amv / 30.4) * DAY));
  return null;
}
function safeMatch(p, t) { try { return new RegExp(p, 'i').test(t); } catch { return t.toLowerCase().includes(p.toLowerCase()); } }

/** Demo-mode alert engine (live mode does this inside the dca-ingest + fleet-jobs edge functions). */
function evaluateAlerts(devs = T.devices) {
  const defs = T.alert_definitions.filter(d => d.enabled); const now = new Date(); const nowIso = iso(now);
  let opened = 0;
  for (const dev of devs) {
    if (dev.is_blocked) continue;
    const sup = IDX.sup.get(dev.id) || [], evs = (IDX.events.get(dev.id) || []).filter(e => e.status !== 'closed');
    const open = T.alerts.filter(a => a.device_id === dev.id && a.status !== 'closed');
    const want = new Map();
    for (const def of defs) {
      if (def.account_id && def.account_id !== dev.account_id) continue;
      if (def.managed_only && !dev.is_managed) continue;
      if (def.kind === 'supply_level' || def.kind === 'supply_days') {
        for (const s of sup) {
          const ok = def.supply_match ? safeMatch(def.supply_match, s.name) : MARKERS.has(s.supply_type);
          if (!ok || s.level_pct == null) continue;
          const bd = s.est_empty_date ? businessDaysUntil(s.est_empty_date, now) : null;
          const hit = def.kind === 'supply_level' ? +s.level_pct <= +def.threshold : bd != null && bd <= +def.threshold;
          if (!hit) continue;
          want.set(def.kind + '|' + s.name, { definition_id: def.id, account_id: dev.account_id, device_id: dev.id, kind: def.kind, severity: +s.level_pct <= 0 ? 'critical' : def.severity, supply_name: s.name, level_pct: s.level_pct, est_empty_date: s.est_empty_date, message: def.kind === 'supply_level' ? `${s.name} at ${s.level_pct}% (threshold ${def.threshold}%)` : `${s.name} est. empty ${s.est_empty_date} (${bd} business days)` });
        }
      }
      if (def.kind === 'service') for (const e of evs) want.set('service|' + e.description, { definition_id: def.id, account_id: dev.account_id, device_id: dev.id, kind: 'service', severity: e.severity, supply_name: e.description, message: `${e.description} (code ${e.code})` });
      if (def.kind === 'no_data' && isStale(dev, +def.threshold)) want.set('no_data|', { definition_id: def.id, account_id: dev.account_id, device_id: dev.id, kind: 'no_data', severity: def.severity, supply_name: null, message: `Device has not reported since ${F.d(dev.last_audit)}` });
    }
    for (const [k, a] of want) {
      const ex = open.find(x => x.kind + '|' + (x.supply_name || '') === k);
      if (ex) Object.assign(ex, { last_detected: nowIso, level_pct: a.level_pct ?? null, est_empty_date: a.est_empty_date ?? null, severity: a.severity, message: a.message });
      else { T.alerts.push({ id: uid(), status: 'open', first_detected: nowIso, last_detected: nowIso, ...a }); opened++; }
    }
    for (const ex of open) if (!want.has(ex.kind + '|' + (ex.supply_name || ''))) Object.assign(ex, { status: 'closed', closed_at: nowIso, closed_reason: 'Condition cleared' });
  }
  // DCA offline
  for (const def of defs.filter(d => d.kind === 'dca_offline')) {
    for (const x of T.dca_installs.filter(x => x.status === 'active' && (!def.account_id || x.account_id === def.account_id))) {
      const open = T.alerts.find(a => a.dca_id === x.id && a.kind === 'dca_offline' && a.status !== 'closed');
      if (dcaStale(x, +def.threshold) && !open) { T.alerts.push({ id: uid(), definition_id: def.id, account_id: x.account_id, dca_id: x.id, kind: 'dca_offline', severity: def.severity, message: `DCA "${x.name}" has not reported since ${F.dt(x.last_reported)}`, status: 'open', first_detected: nowIso, last_detected: nowIso }); opened++; }
      if (!dcaStale(x, +def.threshold) && open) Object.assign(open, { status: 'closed', closed_at: nowIso, closed_reason: 'DCA reporting again' });
    }
  }
  reindex(); DB.persist(); return opened;
}

/** Recompute AMV from accepted reads over the last 90 days (demo). */
function recalcAMV(dev) {
  const rs = READS.filter(r => r.device_id === dev.id && r.accepted).sort((a, b) => new Date(a.read_at) - new Date(b.read_at));
  const last = rs[rs.length - 1]; const first = rs.find(r => new Date(r.read_at) >= new Date(Date.now() - 90 * DAY));
  if (!first || !last || first === last) return;
  const days = Math.max((new Date(last.read_at) - new Date(first.read_at)) / DAY, 1);
  dev.amv_total = Math.max(0, Math.round((last.total - first.total) / days * 30.4));
  dev.amv_mono = Math.max(0, Math.round(((last.mono ?? 0) - (first.mono ?? 0)) / days * 30.4));
  dev.amv_color = Math.max(0, Math.round(((last.color ?? 0) - (first.color ?? 0)) / days * 30.4));
}

/**
 * Billing engine. For each active contract in scope: device start/end meters, pooled allowances,
 * overage at CPP rates, base fee, minimum charge. Produces invoice lines + per-device detail rows
 * (amount 0, with `allocated` = device share of revenue for per-asset P&L).
 */
async function buildBilling({ periodStart, periodEnd, accountIds, cycle = 'all' }) {
  const ps = new Date(periodStart + 'T00:00:00'), pe = new Date(periodEnd + 'T23:59:59');
  const days = Math.max(1, Math.round((pe - ps) / DAY));
  const contracts = T.contracts.filter(c => c.status === 'active' && (!accountIds?.length || accountIds.includes(c.account_id)) &&
    (cycle === 'all' || c.billing_cycle === cycle) && (!c.start_date || c.start_date <= periodEnd) && (!c.end_date || c.end_date >= periodStart));
  const devIds = T.devices.filter(d => contracts.some(c => c.id === d.contract_id) && !d.is_blocked).map(d => d.id);
  const reads = await DB.reads(devIds, new Date(+ps - 60 * DAY), pe);
  const byDev = groupBy(reads.filter(r => r.accepted), 'device_id');
  const lines = []; let sort = 0;
  const S_ = setting('billing'); const ix = integ('xero').settings || {};
  for (const c of contracts) {
    const devs = T.devices.filter(d => d.contract_id === c.id && !d.is_blocked);
    const det = devs.map(d => {
      const rs = byDev.get(d.id) || []; let flag = null;
      let start = null; for (const r of rs) { if (new Date(r.read_at) <= ps) start = r; else break; }
      if (!start) { start = rs.find(r => new Date(r.read_at) > ps && new Date(r.read_at) <= pe) || null; if (start) flag = 'partial'; }
      let end = null; for (const r of rs) if (new Date(r.read_at) <= pe) end = r;
      let mono, color;
      const mOf = r => r.mono ?? (d.is_color ? null : r.total), cOf = r => r.color ?? (d.is_color ? null : 0);
      if (!start || !end || start === end) {
        mono = Math.round((d.amv_mono || 0) * days / 30.4); color = Math.round((d.amv_color || 0) * days / 30.4); flag = 'estimated';
      } else {
        mono = (mOf(end) ?? 0) - (mOf(start) ?? 0); color = (cOf(end) ?? 0) - (cOf(start) ?? 0);
        if (mono < 0 || color < 0) { flag = 'rollover'; mono = Math.max(0, mono); color = Math.max(0, color); }
        else if (pe - new Date(end.read_at) > 3 * DAY && !flag) flag = 'stale_end';
        if (d.is_color && (end.color == null)) flag = flag || 'no_color_split';
      }
      return { d, start, end, mono, color, flag };
    });
    const tm = det.reduce((a, x) => a + x.mono, 0), tc = det.reduce((a, x) => a + x.color, 0);
    const bm = Math.max(0, tm - (c.included_mono || 0)), bc = Math.max(0, tc - (c.included_color || 0));
    const per = `${F.d(periodStart)} – ${F.d(periodEnd)}`;
    const base = { run_id: null, account_id: c.account_id, contract_id: c.id, tax_code: c.tax_code || null };
    const out = [];
    if (+c.base_fee > 0) out.push({ ...base, line_type: 'base', description: `Managed Print Services — ${c.tier} (${c.name}) — ${per}`, billable: 1, rate: +c.base_fee, amount: round2(c.base_fee), account_code: ix.base_account || null, item_code: ix.base_item || null });
    const pageLine = (type, pages, incl, bill, rate, label) => ({ ...base, line_type: type, pages, included: incl, billable: bill, rate: +rate, amount: round2(bill * rate),
      description: `${label} pages ${per}: ${pages.toLocaleString('en-CA')} printed${incl ? `, ${incl.toLocaleString('en-CA')} included` : ''} — ${bill.toLocaleString('en-CA')} billable @ ${F.rate(rate)}`,
      account_code: ix[type + '_account'] || null, item_code: ix[type + '_item'] || null });
    if (c.invoice_detail === 'per_device') {
      for (const x of det) {
        const shareM = tm ? x.mono / tm : 0, shareC = tc ? x.color / tc : 0;
        const im = Math.round((c.included_mono || 0) * shareM), ic = Math.round((c.included_color || 0) * shareC);
        const tag = `${x.d.model || ''} SN ${x.d.serial}`;
        if (+c.mono_rate > 0 || x.mono) { const l = pageLine('mono', x.mono, im, Math.max(0, x.mono - im), c.mono_rate, 'Mono'); l.description = `${tag} — ` + l.description; l.device_id = x.d.id; out.push(l); }
        if (x.d.is_color && (+c.color_rate > 0 || x.color)) { const l = pageLine('color', x.color, ic, Math.max(0, x.color - ic), c.color_rate, 'Colour'); l.description = `${tag} — ` + l.description; l.device_id = x.d.id; out.push(l); }
      }
    } else {
      if (+c.mono_rate > 0 || tm) out.push(pageLine('mono', tm, c.included_mono || 0, bm, c.mono_rate, 'Mono'));
      if (devs.some(d => d.is_color) && (+c.color_rate > 0 || tc)) out.push(pageLine('color', tc, c.included_color || 0, bc, c.color_rate, 'Colour'));
    }
    const sub = round2(out.reduce((a, l) => a + l.amount, 0));

async function boot() {
  try { await DB.init(); }
  catch (e) { CFG.mode = 'demo'; LS.set(CFG_KEY, CFG); toast('Live connection failed — switched to demo: ' + e.message, 'err'); await DB.init(); }
  TABLES.forEach(t => T[t] = T[t] || []); reindex();
  if (DB.live()) {
    const { data: { session } } = await SB.auth.getSession();
    if (session) { try { await afterLiveLogin(); return; } catch (e) { console.warn(e); } }
  } else {
    const s = SS.get('urfleet_demo_session'); const u = s && T.app_users.find(x => x.id === s.id && x.active);
    if (u) { S.user = u; return startApp(); }
  }
  renderLogin();
}
async function afterLiveLogin() {
  const { data: { user } } = await SB.auth.getUser();
  const { data: me } = await SB.from('app_users').select('*').eq('auth_user_id', user.id).maybeSingle();
  if (!me || !me.active) { await SB.auth.signOut(); throw new Error('Not an active UrFleet user'); }
  S.user = me; renderLoading(); await DB.loadAll(); reindex(); startApp();
}

/** Demo: emulate a DCA check-in (meters advance, supplies deplete, alerts re-evaluate). */
function simulateDCA(id, quiet) {
  const x = IDX.dca.get(id); const now = Date.now(); const devs = T.devices.filter(d => d.dca_id === id && !d.is_blocked);
  for (const d of devs) {
    const last = READS.filter(r => r.device_id === d.id && r.accepted).sort((a, b) => new Date(b.read_at) - new Date(a.read_at))[0];
    const days = last ? Math.max(0.2, (now - new Date(last.read_at)) / DAY) : 1;
    const mono = (last?.mono ?? 0) + Math.round((d.amv_mono || 300) / 30.4 * days * (0.7 + Math.random() * 0.6));
    const color = d.is_color ? (last?.color ?? 0) + Math.round((d.amv_color || 100) / 30.4 * days * (0.7 + Math.random() * 0.6)) : 0;
    READS.push({ id: uid(), device_id: d.id, read_at: iso(now), total: mono + color, mono, color, source: 'dca', accepted: true });
    const printed = (mono + color) - (last?.total ?? 0);
    for (const s of IDX.sup.get(d.id) || []) {
      if (s.level_pct == null) continue; const pages = s.color && s.color !== 'black' ? (color - (last?.color ?? 0)) / 3 : s.supply_type === 'drum' ? printed : (mono - (last?.mono ?? 0)) + (d.is_color ? (color - (last?.color ?? 0)) * 0.25 : 0);
      if (s.ref_level == null) { s.ref_level = s.level_pct; s.ref_at = s.last_reported; }
      s.level_pct = Math.max(0, round2(s.level_pct - (pages / (s.yield_pages || 10000)) * 100)); s.level_pct = Math.round(s.level_pct * 10) / 10; s.last_reported = iso(now); s.est_empty_date = estEmpty(s, d);
    }
    Object.assign(d, { meter_mono: mono, meter_color: color, meter_total: mono + color, last_audit: iso(now) }); recalcAMV(d);
  }
  Object.assign(x, { last_reported: iso(now), status: 'active', version: x.version || '1.0.0', host_name: x.host_name || 'SITE-PC01', last_device_count: devs.length });
  T.dca_commands.filter(k => k.dca_id === id && k.status === 'queued').forEach(k => Object.assign(k, { status: 'done', completed_at: iso(now) }));
  reindex(); const n = evaluateAlerts(devs); if (!quiet) { toast(`DCA "${x.name}" checked in: ${devs.length} devices, ${n} new alert(s)`, 'ok'); render(); } return n;
}

function normalizeImport(r) {

  return { ...r,
    account: pick('account', 'account_name', 'customer', 'customer_name', 'client'),
    serial: pick('serial', 'serial_number', 'serial_#', 'serial_no', 'sn'),
    manufacturer: pick('manufacturer', 'make', 'brand'), model: pick('model', 'model_name', 'device_model'),
    ip: pick('ip', 'ip_address', 'ipaddress'), location: pick('location', 'device_location'), asset_no: pick('asset_no', 'asset_#', 'asset_number', 'asset'),
    is_managed: pick('is_managed', 'managed'), is_color: pick('is_color', 'color_device', 'colour'),
    read_at: pick('read_at', 'date', 'audit_date', 'last_audit', 'last_reported', 'reported', 'meter_date', 'timestamp'),
    total: pick('total', 'total_pages', 'total_impressions', 'page_count', 'life_count'), mono: pick('mono', 'total_mono', 'mono_pages', 'black', 'black_&_white', 'b&w'),
    color: pick('color', 'colour', 'total_color', 'color_pages', 'total_colour') };

function importReads() {

    [{ label: 'Cancel' }, { label: 'Import', fn: async () => {
      const f = $('#csvf').files[0]; if (!f) throw new Error('Choose a CSV file');
      const rows = parseCSV(await f.text()).map(normalizeImport); const bySerial = groupBy(T.devices, 'serial'); const out = []; let skipped = 0;
      for (const r of rows) {
        const d = (bySerial.get(r.serial) || [])[0]; const t = new Date(r.read_at); const mono = num(String(r.mono).replace(/,/g, '')), color = num(String(r.color).replace(/,/g, '')); let total = num(String(r.total).replace(/,/g, ''));
        if (!d || isNaN(t) || (total == null && mono == null)) { skipped++; continue; }
        if (total == null) total = (mono || 0) + (color || 0);
        out.push({ device_id: d.id, read_at: iso(t), total, mono: mono ?? (d.is_color ? null : total), color: color ?? (d.is_color ? null : 0), source: 'import', accepted: true });
      }
      if (out.length) await DB.insert('meter_reads', out);
      const touched = [...new Set(out.map(r => r.device_id))];

async function devicePnL(d) {
  const months = []; const now = new Date();
  for (let i = 5; i >= 0; i--) { const s = new Date(now.getFullYear(), now.getMonth() - i - 1, 1), e = new Date(now.getFullYear(), now.getMonth() - i, 0); months.push([ymd(s), ymd(e)]); }
  const rows = [];
  for (const [ps, pe] of months) rows.push(await pnlFor([d], ps, pe).then(r => ({ month: ps.slice(0, 7), ...r[0] })));
  const target = setting('billing').target_margin || 35; const c = IDX.con.get(d.contract_id);
  return `<div class="card"><h2>Contract</h2>${c ? `<dl class="kv"><dt>Contract</dt><dd>${esc(c.name)} (${esc(c.tier)})</dd><dt>Rates</dt><dd>Mono ${F.rate(c.mono_rate)} · Colour ${F.rate(c.color_rate)} · Base ${F.m(c.base_fee)}/${esc(c.billing_cycle)}</dd><dt>Included</dt><dd>${F.n(c.included_mono)} mono / ${F.n(c.included_color)} colour (pooled across ${T.devices.filter(x => x.contract_id === c.id).length} device(s))</dd></dl>` : '<p class="muted">Not on a contract — no billing revenue. Assign one under Edit or Devices → Assign contract.</p>'}</div>
  <div class="card"><div class="row"><h2 class="sp">Per-asset P&amp;L — last 6 months</h2>${canWrite() ? `<button class="btn ghost sm" onclick="addCost('${d.id}')">+ Cost</button>` : ''}</div>
  ${tbl('dev-pnl', [{ label: 'Month', k: 'month' }, { label: 'Pages', cls: 'num', f: r => F.n(r.pages) }, { label: 'Revenue', cls: 'num', f: r => F.m(r.revenue) }, { label: 'Supplies', cls: 'num', f: r => F.m(r.supplies) }, { label: 'Labour/parts', cls: 'num', f: r => F.m(r.service) }, { label: 'Lease/depr.', cls: 'num', f: r => F.m(r.lease) },
    { label: 'Gross profit', cls: 'num', f: r => `<b style="color:${r.gp < 0 ? 'var(--crit)' : 'inherit'}">${F.m(r.gp)}</b>` }, { label: 'Margin', cls: 'num', f: r => r.revenue ? `<span class="tag ${r.margin < target ? 'crit' : 'ok'}">${r.margin.toFixed(0)}%</span>` : '—' }], rows)}
  <p class="muted small">Revenue = this device's share of its contract invoice (base fee split evenly; page charges by its share of billable pages). Below ${target}% margin for 2–3 months → review rate, upgrade equipment, or exit.</p></div>
  <div class="card"><h2>Cost entries</h2>${tbl('dev-costs', [{ label: 'Date', k: 'cost_date' }, { label: 'Category', k: 'category' }, { label: 'Description', k: 'description' }, { label: 'Amount', cls: 'num', k: 'amount', f: x => F.m(x.amount) }], T.device_costs.filter(x => x.device_id === d.id).sort((a, b) => cmp(b.cost_date, a.cost_date)))}</div>`;
}
async function pnlFor(devs, ps, pe) {
  const accs = [...new Set(devs.map(d => d.account_id))];
  const { lines } = await buildBilling({ periodStart: ps, periodEnd: pe, accountIds: accs });
  const months = Math.max(1, Math.round((new Date(pe) - new Date(ps)) / DAY / 30.4));
  return devs.map(d => {
    const dl = lines.find(l => l.line_type === 'device' && l.device_id === d.id);
    const inP = t => t && t.slice(0, 10) >= ps && t.slice(0, 10) <= pe;
    const supplies = T.supply_orders.filter(o => o.device_id === d.id && ['delivered', 'installed'].includes(o.status) && inP(o.delivered_at || o.ordered_at)).reduce((a, o) => a + (+o.unit_cost || 0) * (o.qty || 1), 0) + T.device_costs.filter(x => x.device_id === d.id && x.category === 'supplies' && inP(x.cost_date)).reduce((a, x) => a + +x.amount, 0);
    const service = T.device_costs.filter(x => x.device_id === d.id && ['labour', 'parts', 'other'].includes(x.category) && inP(x.cost_date)).reduce((a, x) => a + +x.amount, 0);
    const lease = (+d.monthly_lease || 0) * months + T.device_costs.filter(x => x.device_id === d.id && ['lease', 'depreciation'].includes(x.category) && inP(x.cost_date)).reduce((a, x) => a + +x.amount, 0);
    const revenue = dl?.allocated || 0; const gp = revenue - supplies - service - lease;
    return { device: d, pages: dl ? dl.pages : 0, revenue, supplies, service, lease, gp, margin: revenue ? gp / revenue * 100 : 0, flag: dl?.flag };
  });
}

function newRun() {
  const now = new Date(); const ps = ymd(new Date(now.getFullYear(), now.getMonth() - 1, 1)), pe = ymd(new Date(now.getFullYear(), now.getMonth(), 0));
  const accs = [...new Set(T.contracts.filter(c => c.status === 'active').map(c => c.account_id))];
  modal('New billing run', `<form class="fg">${inp('period_start', 'Period start', ps, 'date')}${inp('period_end', 'Period end', pe, 'date')}${inp('invoice_date', 'Invoice date', ymd(now), 'date')}${sel('cycle', 'Contracts', [['monthly', 'Monthly cycle'], ['quarterly', 'Quarterly cycle'], ['annual', 'Annual cycle'], ['all', 'All cycles']], 'monthly')}
    <div class="wide"><label class="f">Accounts (none selected = all with active contracts)<select name="accounts" multiple size="7">${accs.map(a => `<option value="${a}">${esc(acctName(a))}</option>`).join('')}</select></label></div>
    <div class="wide note blue">Meters are taken from accepted reads at the period boundaries. Missing reads are estimated from AMV and flagged for review before you approve.</div></form>`,
    [{ label: 'Cancel' }, { label: 'Build preview', fn: async v => {
      if (v.period_end < v.period_start) throw new Error('Period end is before start');

      if (!lines.length) throw new Error('No active contracts with devices in scope');
      const inv = invoiceLines(lines);
      const run = await DB.insert('billing_runs', { name: `MPS ${new Date(v.period_end + 'T12:00').toLocaleDateString('en-CA', { month: 'long', year: 'numeric' })}`, period_start: v.period_start, period_end: v.period_end, invoice_date: v.invoice_date, status: 'draft', subtotal: round2(inv.reduce((a, l) => a + l.amount, 0)), line_count: inv.length, flags: lines.filter(l => l.flag).length, created_by: S.user.id });
      await DB.insert('billing_lines', lines.map(({ mono_pages, color_pages, ...l }) => ({ ...l, run_id: run.id })));
      location.hash = `#/billing/run/${run.id}`;
    } }]);
}
async function vRun(id) {
  const run = T.billing_runs.find(r => r.id === id); if (!run) return `<div class="card">Run not found</div>`;

      <table class="t"><thead><tr><th>Line</th><th class="num">Pages</th><th class="num">Included</th><th class="num">Billable</th><th class="num">Rate</th><th class="num">Amount</th>${draft && isAdmin() ? '<th></th>' : ''}</tr></thead><tbody>

        : `<tr><td>${esc(l.description)} <span class="tag">${esc(l.line_type)}</span></td><td class="num">${F.n(l.pages)}</td><td class="num">${F.n(l.included)}</td><td class="num">${F.n(l.billable)}</td><td class="num">${l.rate != null ? F.rate(l.rate) : ''}</td><td class="num"><b>${F.m(l.amount)}</b></td>${draft && isAdmin() ? `<td><button class="btn xs ghost" onclick="editLine('${id}','${l.id}')">Edit</button></td>` : ''}</tr>`).join('')}
      </tbody></table>${draft && isAdmin() ? `<button class="btn xs ghost" style="margin-top:8px" onclick="editLine('${id}',null,'${acc}')">+ Adjustment</button>` : ''}</div>`;
  }).join('');

  const xi = integ('xero'), qi = integ('qbo');
  return `<div class="ph"><div><div class="muted small"><a href="#/billing">Meter Billing</a></div><h1>${esc(run.name)}</h1></div><span class="sp"></span><span class="tag ${run.status === 'exported' ? 'ok' : run.status === 'approved' ? 'info' : 'warn'}">${esc(run.status)}</span></div>

  <div class="card"><div class="row">

    ${inp('supply_match', 'Supply name match (regex, optional)', d.supply_match, 'text', 'placeholder="blank = toner/ink only, e.g. drum|imaging"')}<div class="wide">${inp('recipients', 'Email recipients (comma separated)', (d.recipients || []).join(', '))}</div>
    <div class="wide row">${chk('managed_only', 'Managed devices only', d.managed_only)}${chk('create_hubspot_ticket', 'Create HubSpot ticket automatically', d.create_hubspot_ticket)}${chk('enabled', 'Enabled', d.enabled)}</div></form>`,
    [...(id ? [{ label: 'Delete', cls: 'danger', fn: async () => { await DB.remove('alert_definitions', id); render(); } }] : []), { label: 'Cancel' }, { label: 'Save', fn: async v => {
      if (!v.name) throw new Error('Name required'); v.account_id = v.account_id || null; v.supply_match = v.supply_match || null; v.recipients = (v.recipients || '').split(/[,;\s]+/).filter(Boolean);
      id ? await DB.update('alert_definitions', id, v) : await DB.insert('alert_definitions', v); if (!DB.live()) evaluateAlerts(); toast('Alert definition saved', 'ok'); render();
    } }], { wide: true });
}
function editPart(id) {
  const p = id ? T.part_catalog.find(x => x.id === id) : { vendor: 'TD Synnex' };
  modal(id ? 'Edit part' : 'New part', `<form class="fg">${inp('manufacturer', 'Manufacturer', p.manufacturer)}${inp('model_match', 'Model match *', p.model_match, 'text', 'placeholder="VersaLink C405"')}${inp('supply_match', 'Supply match *', p.supply_match, 'text', 'placeholder="Black"')}${inp('part_no', 'Part # *', p.part_no)}<div class="wide">${inp('description', 'Description', p.description)}</div>${inp('yield_pages', 'Yield (pages)', p.yield_pages, 'number')}${inp('cost', 'Landed cost ($)', p.cost, 'number', 'step="0.01"')}${inp('price', 'Sell price ($)', p.price, 'number', 'step="0.01"')}${sel('vendor', 'Vendor', ['TD Synnex', 'Ingram Micro', 'GetToner.ca stock', 'OEM direct', 'Other'], p.vendor)}</form>`,
    [...(id ? [{ label: 'Delete', cls: 'danger', fn: async () => { await DB.remove('part_catalog', id); render(); } }] : []), { label: 'Cancel' }, { label: 'Save', fn: async v => { if (!v.model_match || !v.supply_match || !v.part_no) throw new Error('Model, supply and part # are required'); id ? await DB.update('part_catalog', id, v) : await DB.insert('part_catalog', v); render(); } }]);
}
function importCatalog() {
  modal('Import part catalogue (CSV)', `<p class="small">Columns: <span class="mono">manufacturer, model_match, supply_match, part_no, description, yield_pages, cost, price, vendor</span></p><input type="file" id="csvf" accept=".csv,text/csv">`,
    [{ label: 'Cancel' }, { label: 'Import', fn: async () => { const f = $('#csvf').files[0]; if (!f) throw new Error('Choose a file'); const rows = parseCSV(await f.text()).filter(r => r.part_no && r.model_match).map(r => ({ manufacturer: r.manufacturer || null, model_match: r.model_match, supply_match: r.supply_match || 'Black', part_no: r.part_no, description: r.description || null, yield_pages: num(r.yield_pages), cost: num(r.cost), price: num(r.price), vendor: r.vendor || null })); await DB.insert('part_catalog', rows); toast(`${rows.length} parts imported`, 'ok'); render(); } }]);
}
function vIntegrations() {
  const xi = integ('xero'), qi = integ('qbo'), hi = integ('hubspot'); const xs = xi.settings || {}, qs = qi.settings || {}, hs = hi.settings || {};
  const q = S.route.q; if (q.get('provider') && !window._shownCb) { window._shownCb = true; setTimeout(() => toast(q.get('ok') === '1' ? `${q.get('provider').toUpperCase()} connected: ${q.get('msg') || ''}` : `Connection failed: ${q.get('msg') || ''}`, q.get('ok') === '1' ? 'ok' : 'err'), 100); if (DB.live()) DB.loadAll().then(() => { reindex(); render(); }); }
  const statusTag = i => i.connected ? `<span class="tag ok">Connected</span> ${esc(i.tenant_name || '')}` : '<span class="tag">Not connected</span>';
  return `<div class="grid g2">
  <div class="card"><div class="row"><h2 class="sp">Xero</h2>${statusTag(xi)}</div>
    <p class="small muted">Approved billing runs create <b>DRAFT</b> sales invoices (GST exclusive) — review and approve them in Xero. Contacts are matched by name or created. No connection needed for CSV import.</p>
    <div class="row" style="margin-bottom:12px">${DB.live() ? (xi.connected ? `<button class="btn ghost sm" onclick="acctDisconnect('xero')">Disconnect</button><button class="btn ghost sm" onclick="acctLookup('xero')">Load tax rates, accounts &amp; items</button>` : `<button class="btn sm" onclick="acctConnect('xero')">Connect to Xero</button>`) : '<span class="muted small">Connect available in live mode.</span>'}</div>
    <form id="xf" class="fg">${inp('tax_type', 'GST tax type (TaxType code) *', xs.tax_type, 'text', 'list="x-tax" placeholder="load list or enter code"')}${inp('default_account', 'Default revenue account code', xs.default_account || '200', 'text', 'list="x-acc"')}${inp('base_account', 'Base fee account', xs.base_account, 'text', 'list="x-acc"')}${inp('mono_account', 'Mono pages account', xs.mono_account, 'text', 'list="x-acc"')}${inp('color_account', 'Colour pages account', xs.color_account, 'text', 'list="x-acc"')}${inp('mono_item', 'Mono item code (optional)', xs.mono_item, 'text', 'list="x-item"')}${inp('color_item', 'Colour item code (optional)', xs.color_item, 'text', 'list="x-item"')}${inp('base_item', 'Base fee item code (optional)', xs.base_item, 'text', 'list="x-item"')}</form>
    ${['tax', 'acc', 'item'].map(k => `<datalist id="x-${k}">${(window._xlk?.[{ tax: 'tax', acc: 'accounts', item: 'items' }[k]] || []).map(o => `<option value="${esc(o.id)}">${esc(o.name)}</option>`).join('')}</datalist>`).join('')}
    <button class="btn sm" style="margin-top:10px" onclick="saveInteg('xero','#xf')">Save Xero mapping</button></div>
  <div class="card"><div class="row"><h2 class="sp">QuickBooks Online</h2>${statusTag(qi)}</div>
    <p class="small muted">Creates invoices with a GST tax code on every line (required for Canadian QBO companies). Customers are matched by display name or created.</p>
    <div class="row" style="margin-bottom:12px">${DB.live() ? (qi.connected ? `<button class="btn ghost sm" onclick="acctDisconnect('qbo')">Disconnect</button><button class="btn ghost sm" onclick="acctLookup('qbo')">Load tax codes &amp; items</button>` : `<button class="btn sm" onclick="acctConnect('qbo')">Connect to QuickBooks</button>`) : '<span class="muted small">Connect available in live mode.</span>'}</div>
    <form id="qf" class="fg">${inp('tax_code_id', 'GST tax code ID (API) *', qs.tax_code_id, 'text', 'list="q-tax"')}${inp('tax_code_name', 'GST tax code name (CSV)', qs.tax_code_name || 'GST')}${inp('base_item', 'Base fee item ID', qs.base_item, 'text', 'list="q-item"')}${inp('mono_item', 'Mono pages item ID', qs.mono_item, 'text', 'list="q-item"')}${inp('color_item', 'Colour pages item ID', qs.color_item, 'text', 'list="q-item"')}${inp('default_item', 'Fallback item ID (minimum/adjustment)', qs.default_item, 'text', 'list="q-item"')}${inp('base_item_name', 'Base item name (CSV)', qs.base_item_name || 'MPS Base Fee')}${inp('mono_item_name', 'Mono item name (CSV)', qs.mono_item_name || 'Mono Pages')}${inp('color_item_name', 'Colour item name (CSV)', qs.color_item_name || 'Colour Pages')}</form>
    ${['tax', 'item'].map(k => `<datalist id="q-${k}">${(window._qlk?.[k === 'tax' ? 'tax' : 'items'] || []).map(o => `<option value="${esc(o.id)}">${esc(o.name)}</option>`).join('')}</datalist>`).join('')}
    <button class="btn sm" style="margin-top:10px" onclick="saveInteg('qbo','#qf')">Save QuickBooks mapping</button></div>
  <div class="card"><div class="row"><h2 class="sp">HubSpot</h2>${statusTag(hi)}</div><p class="small muted">Uses a HubSpot <b>private app</b> token stored as the <span class="mono">HUBSPOT_TOKEN</span> function secret. Scopes: companies read/write, company schema write, tickets, contacts read.</p>
    <form id="hf" class="fg">${inp('ticket_pipeline', 'Ticket pipeline ID', hs.ticket_pipeline || '0')}${inp('ticket_stage', 'New-ticket stage ID', hs.ticket_stage || '1')}</form><button class="btn sm" style="margin-top:10px" onclick="saveInteg('hubspot','#hf')">Save HubSpot settings</button></div>
  <div class="card"><h2>Billing export settings</h2><form id="bf" class="fg">${inp('invoice_prefix', 'CSV invoice # prefix', setting('billing').invoice_prefix)}${inp('next_invoice_no', 'Next CSV invoice #', setting('billing').next_invoice_no, 'number')}${inp('due_days', 'Default payment terms (days)', setting('billing').due_days, 'number')}${sel('csv_date_format', 'CSV date format (match your Xero/QBO region)', ['YYYY-MM-DD', 'DD/MM/YYYY', 'MM/DD/YYYY'], setting('billing').csv_date_format)}${inp('target_margin', 'Target gross margin %', setting('billing').target_margin, 'number')}</form>
    <button class="btn sm" style="margin-top:10px" onclick="DB.upsertSetting('billing',{...setting('billing'),...formData('#bf')}).then(()=>toast('Saved','ok'))">Save</button>
    <p class="muted small">Alberta: 5% GST only (no PST). Confirm your GST/HST registration number is on invoice templates in Xero/QBO — CRA requires it on invoices of $30+.</p></div></div>`;
}
async function saveInteg(p, f) { const i = integ(p); const settings = { ...(i.settings || {}), ...formData(f) }; if (DB.live()) await DB.update('integrations', p, { settings }); else { i.settings = settings; if (!T.integrations.includes(i)) T.integrations.push(i); DB.persist(); } toast('Saved', 'ok'); }
async function acctConnect(p) { try { const o = await DB.fn('accounting', { action: 'connect', provider: p }); location.href = o.url; } catch (e) { toast(e.message, 'err'); } }
async function acctDisconnect(p) { confirmBox(`Disconnect ${p.toUpperCase()}?`, 'Tokens are deleted. Mappings are kept.', async () => { await DB.fn('accounting', { action: 'disconnect', provider: p }); await DB.loadAll(); reindex(); render(); }, 'Disconnect'); }
async function acctLookup(p) { try { const o = await DB.fn('accounting', { action: 'lookup', provider: p }); window[p === 'xero' ? '_xlk' : '_qlk'] = o; toast(`Loaded ${o.tax?.length || 0} tax codes, ${o.items?.length || 0} items`, 'ok'); render(); } catch (e) { toast(e.message, 'err'); } }
function vSettings() {
  const c = setting('company');
  return `<div class="grid g2"><div class="card"><h2>Company</h2><form id="cf" class="fg">${inp('name', 'Trading name', c.name)}${inp('legal_name', 'Legal name', c.legal_name)}${inp('owner', 'Owner', c.owner)}${inp('email', 'Orders / alerts email', c.email, 'email')}${inp('gst_number', 'GST registration #', c.gst_number)}${inp('gst_rate', 'GST rate (decimal)', c.gst_rate ?? 0.05, 'number', 'step="0.001"')}</form>
    <button class="btn sm" style="margin-top:10px" onclick="DB.upsertSetting('company',{...setting('company'),...formData('#cf')}).then(()=>toast('Saved','ok'))">Save</button></div>
  <div class="card"><h2>Connection</h2><dl class="kv"><dt>Mode</dt><dd>${DB.live() ? 'Live — Supabase' : 'Demo — sample data in this browser only'}</dd>${DB.live() ? `<dt>Project</dt><dd class="mono">${esc(CFG.url)}</dd><dt>DCA endpoint</dt><dd class="mono">${esc(dcaEndpoint())}</dd>` : ''}</dl><button class="btn ghost sm" style="margin-top:10px" onclick="connSettings()">Change connection</button>
    <p class="muted small">Sessions lock after 60 minutes idle. In live mode every table is protected by Row Level Security; DCA keys and integration tokens are never sent to the browser.</p></div></div>`;
}

// ---------- start ----------
boot();
</script>
</body>
</html>
